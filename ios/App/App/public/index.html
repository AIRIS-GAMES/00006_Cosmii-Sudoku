<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cosmii Sudoku</title>
<style>
  /* Self-hosted. Pulling these from Google's CDN meant the very first launch,
     and every offline launch, fell back to the system font — and it made a
     native app depend on the network to look right. Both families ship as
     variable fonts, so one file each covers every weight the UI uses. */
  @font-face{
    font-family:'Baloo 2';
    font-style:normal;
    font-weight:400 800;
    font-display:swap;
    src:url('assets/fonts/Baloo2.woff2') format('woff2');
  }
  @font-face{
    font-family:'Nunito';
    font-style:normal;
    font-weight:200 1000;
    font-display:swap;
    src:url('assets/fonts/Nunito.woff2') format('woff2');
  }
  :root{
    --bg: #F4ECDF;
    --card: #FFFFFF;
    --card-soft: #FBF1E2;
    --text: #6B4A3E;
    --text-muted: #B49A87;
    --accent: #F0A33E;
    --accent-2: #4FA6C7;
    --accent-dark: #E0862F;
    --danger: #E2574C;
    --line: rgba(107,74,62,0.10);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .display{font-family:'Baloo 2',cursive;}
  /* Japanese wraps mid-phrase by default, which reads badly in short tip
     cards. auto-phrase breaks on grammatical boundaries instead; balance
     evens out the ragged edge of any line we didn't break by hand. */
  html[lang="ja"] .coach-tip,
  html[lang="ja"] .modal-card,
  html[lang="ja"] .rulecard p,
  html[lang="ja"] .title-card h3{ word-break:auto-phrase; line-break:strict; }
  .coach-tip, .modal-card .best-line, .rulecard p{ text-wrap:balance; }
  #app{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:22px 16px;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .screen.active{opacity:1; pointer-events:auto;}

  /* ---------- Title screen ---------- */
  #title-screen{
    justify-content:flex-start;
    padding-top:calc(54px + env(safe-area-inset-top));
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    background-image:
      radial-gradient(circle at 12% 8%, rgba(107,74,62,0.05) 0 34px, transparent 35px),
      radial-gradient(circle at 60% 4%, rgba(107,74,62,0.05) 0 30px, transparent 31px),
      radial-gradient(circle at 90% 14%, rgba(107,74,62,0.05) 0 26px, transparent 27px),
      radial-gradient(circle at 30% 88%, rgba(107,74,62,0.05) 0 32px, transparent 33px),
      radial-gradient(circle at 78% 92%, rgba(107,74,62,0.05) 0 28px, transparent 29px);
  }
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .coin-icon{width:24px; height:24px; flex-shrink:0; object-fit:contain; border-radius:50%; display:block;}
  .coin-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border-radius:20px; padding:6px 13px 6px 9px;
    font-family:'Baloo 2'; font-weight:700; font-size:16px; color:#B07A17;
    box-shadow:0 2px 0 rgba(107,74,62,0.08);
  }
  .coin-chip.bump{animation:coinBump .45s ease;}
  @keyframes coinBump{
    0%,100%{transform:scale(1);} 35%{transform:scale(1.16);}
  }
  .coin-reward{
    display:flex; align-items:center; justify-content:center; gap:7px;
    background:var(--card-soft); border-radius:14px; padding:9px;
    margin:2px 0 4px;
  }
  .coin-reward .coin-icon{width:26px; height:26px; object-fit:contain; border-radius:50%; display:block;}
  .coin-reward .coin-gain{
    font-family:'Baloo 2'; font-weight:800; font-size:19px; color:#B07A17;
  }
  .coin-reward .coin-total{font-size:12px; font-weight:800; color:var(--text-muted);}
  .coin-breakdown{
    display:flex; flex-direction:column; gap:2px;
    margin:0 0 10px; padding:0 4px;
  }
  .coin-breakdown:empty{display:none;}
  .coin-breakdown .brow{
    display:flex; justify-content:space-between;
    font-size:11px; font-weight:800; color:var(--text-muted);
  }
  .coin-breakdown .brow .amt{color:#B07A17;}
  .coin-breakdown .note{font-size:11px; font-weight:800; color:var(--text-muted); text-align:center;}
  .modal-overlay.active .coin-reward .coin-gain{
    display:inline-block; animation:coinPop .5s .15s backwards cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes coinPop{
    0%{opacity:0; transform:translateY(8px) scale(.6);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .lang-toggle{
    display:flex; background:var(--card); border-radius:20px; padding:3px;
    box-shadow:0 2px 0 rgba(107,74,62,0.08);
  }
  .lang-toggle button{
    border:none; background:none; cursor:pointer; padding:6px 11px;
    border-radius:16px; font-family:'Nunito',sans-serif;
    font-weight:800; font-size:12px; color:var(--text-muted);
  }
  .lang-toggle button.on{background:var(--accent); color:#fff;}
  .title-topbar{
    width:100%; max-width:420px; display:flex; align-items:center; justify-content:space-between;
    margin-bottom:24px;
    padding-top:10px;
  }
  .avatar-btn{
    width:60px; height:60px; border-radius:18px;
    border:4px solid var(--accent);            /* recoloured by the chosen frame */
    background:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:0; cursor:pointer;
  }
  .avatar-btn:active{transform:scale(0.95);}
  .avatar-btn svg, .avatar-btn img{width:100%; height:100%; display:block;}
  /* contain, not cover: the Cosmii cut-outs have side ears and wings that run
     to the edge of their canvas, and cover shaves them off. The box size comes
     per character from CHARACTER_FIT so faces match across the picker. */
  .avatar-btn img{object-fit:contain;}
  .title-cards{
    width:100%; max-width:420px; display:flex; gap:12px;
    margin:auto 0 0;                 /* pushes the group down off the header */
  }
  .title-card{
    flex:1; border-radius:20px; padding:15px; min-height:158px; text-align:left;
    display:flex; flex-direction:column; cursor:pointer; position:relative; color:#fff;
  }
  .title-card:active{transform:translateY(2px);}
  .title-card h3{margin:0; font-size:15px; font-weight:800; line-height:1.3;}
  .title-card.daily{background:linear-gradient(160deg,#7F86D6,#5B62B8);}
  .title-card.daily.locked{opacity:0.92;}
  .title-card.streak{background:linear-gradient(160deg,#FFC94F,#F0A020);}
  .card-icon-wrap{flex:1; display:flex; align-items:center; justify-content:center;}
  .lock-icon{width:38px; height:46px; opacity:0.95;}
  .daily-icon{width:56px; height:56px;}
  .title-card.daily.locked .daily-icon{display:none;}
  .title-card.daily:not(.locked) .lock-icon{display:none;}
  .sun-icon{width:66px; height:66px;}
  .card-sub{font-size:12px; font-weight:800; opacity:0.9; text-align:center;}
  .card-count-pill{
    background:rgba(255,255,255,0.55); border-radius:14px; text-align:center; padding:6px;
    font-family:'Baloo 2'; font-weight:800; font-size:18px; color:#7A4E00; margin-top:8px;
  }
  .card-check{
    position:absolute; top:12px; right:12px; width:24px; height:24px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
  }
  .cosmii-wordmark{
    display:flex; align-items:center; justify-content:center;
    margin:clamp(18px, 5.5vh, 42px) 0 14px;
    padding:0 8px;
  }
  .cosmii-wordmark-image{
    width:min(86vw, 320px);
    max-width:100%;
    height:auto;
    display:block;
    object-fit:contain;
  }
  /* ---- Other games strip -------------------------------------------------
     A single-card-wide window that loops forever. The track holds a clone of
     the last card in front and the first card behind the real ones, so a
     wrap-around is just a normal slide followed by a silent jump back to the
     matching real card — no rewind animation, no dead end at either edge.
  ------------------------------------------------------------------------ */
  .promo-strip{
    width:100%; max-width:420px;
    margin:18px auto 0;
    overflow:hidden;
    border-radius:24px;
    background:rgba(255,255,255,.92);
    box-shadow:0 18px 40px rgba(49,25,11,.12);
    border:1px solid rgba(255,255,255,.55);
    touch-action:pan-y;
    -webkit-user-select:none;
    user-select:none;
    position:relative;
  }
  .promo-track{
    display:flex;
    will-change:transform;
    touch-action:none;
  }
  .promo-card{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    font-weight:700;
    font-size:14px;
    line-height:1.3;
    transition:background .2s ease;
    box-sizing:border-box;
  }
  .promo-card:hover{background:rgba(240,163,62,.08);}
  .promo-card:active{background:rgba(240,163,62,.14);}
  .promo-icon{
    width:44px; height:44px; min-width:44px;
    border-radius:11px;                     /* iOS icon corner ratio at 44px */
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff; font-family:'Baloo 2'; font-weight:800; font-size:20px;
    box-shadow:0 1px 3px rgba(49,25,11,.22);
  }
  .promo-icon img{width:100%; height:100%; object-fit:cover; display:block;}
  /* Fallback tints, visible only while an icon file is missing. */
  .promo-card[data-tint="1"] .promo-icon{background:linear-gradient(135deg,#6B8AFF,#3E8BFF);}
  .promo-card[data-tint="2"] .promo-icon{background:linear-gradient(135deg,#D24BFF,#9C5CFF);}
  .promo-card[data-tint="3"] .promo-icon{background:linear-gradient(135deg,#FF7E3F,#FF4D66);}
  .promo-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .promo-title{
    display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .promo-sub{font-size:11px; font-weight:800; color:var(--text-muted);}
  .promo-chevron{margin-left:auto; color:var(--text-muted); font-size:18px; flex-shrink:0;}
  .promo-dots{
    display:flex; justify-content:center; gap:5px;
    padding:0 0 9px;
  }
  .promo-dots span{
    width:5px; height:5px; border-radius:50%;
    background:rgba(107,74,62,.22); transition:.25s;
  }
  .promo-dots span.on{background:var(--accent); width:14px; border-radius:3px;}
  .cosmii-logo{display:flex; align-items:center; gap:2px;}
  .cosmii-sub{
    margin-top:2px; font-weight:700; font-size:17px;
    letter-spacing:8px; text-indent:8px;      /* indent offsets trailing space */
    color:var(--text-muted);
  }
  .cosmii-logo .lw{line-height:1.05;}
  .cosmii-logo .lw{font-family:'Baloo 2'; font-weight:800; font-size:52px; color:var(--text); letter-spacing:1px;}
  .cosmii-logo .lw.accent-i{color:var(--accent-2); position:relative;}
  .cosmii-logo .lw.accent-i2{color:var(--accent); position:relative;}
  .cosmii-logo .sparkle{position:absolute; top:-14px; right:-4px; font-size:16px; color:var(--accent-2);}
  .level-btn{
    position:relative;
    z-index:1;
    touch-action:manipulation;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    width:280px; max-width:78vw; padding:16px 18px; border:none; border-radius:24px;
    margin:clamp(20px, 4vh, 42px) 0 auto;    /* auto below centres the group */
    flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff;
    font-family:'Baloo 2'; font-weight:700; font-size:19px; cursor:pointer;
    box-shadow:0 4px 0 rgba(200,110,20,0.35);
  }
  .level-btn:active{transform:translateY(3px); box-shadow:none;}

  /* ---------- Game screen ---------- */
  #game-screen{
    justify-content:flex-start;
    padding-top:calc(48px + env(safe-area-inset-top));
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  .topbar{
    width:100%; max-width:min(92vw,940px);
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .circle-btn{
    background:var(--card); border:none; color:var(--text);
    width:42px; height:42px; border-radius:50%; font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 2px 0 rgba(107,74,62,0.08);
  }
  .circle-btn:active{transform:scale(0.94);}
  .header-stats{display:flex; gap:clamp(12px, 4.5vw, 24px);}
  .header-stat{text-align:center;}
  .header-stat .label{font-size:11px; color:var(--text-muted); font-weight:800;}
  .header-stat .value{font-size:20px; font-weight:800; font-family:'Baloo 2'; color:var(--text); line-height:1.1;}

  .pillrow{
    width:100%; max-width:min(92vw,940px);
    display:flex; gap:10px; justify-content:center; margin-bottom:8px;
  }
  .pill{
    background:var(--card); border-radius:20px; padding:8px 16px;
    display:flex; align-items:center; gap:6px;
    font-weight:800; font-size:14px;
    box-shadow:0 2px 0 rgba(107,74,62,0.06);
  }
  .fortune-icon{
    width:16px;
    height:16px;
    object-fit:contain;
    display:inline-block;
  }
  .pill .frac-cur{color:#3F9A5C;}
  .lifepip{width:15px; height:15px;}

  .rulecards{
    width:100%; max-width:min(92vw,940px);
    display:flex; gap:8px; margin-bottom:8px;
  }
  .rulecard{
    flex:1; background:var(--card-soft); border-radius:14px;
    display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px;
  }
  .rulecard .mini-grid{
    display:grid; grid-template-columns:repeat(3,13px); grid-template-rows:repeat(3,13px); gap:1px;
    flex-shrink:0;
  }
  .rulecard .mini-cell{
    background:#DFC9AE; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:8px; color:#9c8267; font-weight:900;
  }
  .rulecard .mini-cell.face{background:var(--accent-2);}
  .rulecard .mini-face-dot{width:8px; height:8px; border-radius:50%; background:#20223f; position:relative;}
  .rulecard p{margin:0; font-size:10px; font-weight:800; line-height:1.3; color:var(--text); text-align:center;}

  #grid-wrap{
    position:relative; display:grid; background:var(--card);
    border-radius:16px; padding:5px; gap:2px;
    box-shadow:0 4px 0 rgba(107,74,62,0.08);
    width:min(92vw, 940px);
    max-width:100%;
    overflow:hidden;
    /* The rows inside are fixed pixels, so letting the flex column squeeze this
       box does not shrink the board — it just hides the bottom rows behind
       overflow:hidden. fitBoardHeight() resizes it properly instead. */
    flex-shrink:0;
  }
  .bottombar{flex-shrink:0;}
  .cell{
    position:relative; display:flex; align-items:center; justify-content:center;
    border-radius:8px; cursor:pointer; margin:0;
    transition:opacity .2s ease;
  }
  /* Absolutely centred rather than flex-centred: the cell size is a rounded
     integer, so flex could leave a half-pixel bias, and this also makes the
     pop-in animation scale from the exact middle of the square. */
  .cell .piece, .cell .cross-svg{
    position:absolute; top:50%; left:50%; display:block; opacity:0;
    transform:translate(-50%,-50%) scale(0.5); transform-origin:center center;
  }
  .cell .piece{width:84%; height:84%;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), opacity .15s;}
  .cell.filled .piece{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .cell.filled.character-filled .piece{opacity:0; transform:translate(-50%,-50%) scale(0.6);}
  .cell.filled.hinted .piece{filter:drop-shadow(0 0 5px #fff176);}
  .cell .cross-svg{width:56%; height:56%;
    transition:transform .15s ease, opacity .15s ease;}
  .cell .cross-svg .halo{stroke:none; stroke-width:22; fill:none;}
  .cell .cross-svg .mark{stroke:rgba(255,255,255,0.92); stroke-width:14; fill:none;}
  .cell.crossed .cross-svg{opacity:1; transform:translate(-50%,-50%) scale(1);}
  /* A wrong guess is recorded permanently: that cell provably holds no Cosmii,
     so the mark is both a penalty and a genuine deduction the player keeps.
     White halo behind red keeps it readable on every region colour. */
  .cell.wrong .cross-svg{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .cell.wrong .cross-svg .halo{stroke:rgba(255,255,255,0.95);}
  .cell.wrong .cross-svg .mark{stroke:#D8382C; stroke-width:15;}
  .cell.wrong{cursor:default;}
  .cell.wrong::after{
    content:''; position:absolute; inset:0; border-radius:8px;
    background:rgba(60,20,16,0.16); pointer-events:none;
  }
  .cell .pattern-mark{
    position:absolute; top:3px; right:4px; font-size:9px; color:rgba(255,255,255,0.85);
    display:none; font-weight:900;
  }
  /* `contain`, never `cover`: the five cut-outs have very different silhouettes
     — the red one's side ears and the purple one's wings run right to the edge
     of their canvas — and cropping to fill the square lopped those off.
     The box size is not set here: it comes per character from CHARACTER_FIT,
     because sizing every image identically renders the same face at wildly
     different sizes. See that table for the derivation. */
  .cell .character-img{
    position:absolute;
    width:100%;
    height:100%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.95);
    object-fit:contain;
    opacity:0;
    transition:opacity .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
  }
  .cell.filled.character-filled .piece{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.6);
  }
  .cell.filled.character-filled .character-img{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    animation:characterPop .35s ease forwards, characterFloat 3.5s ease-in-out .35s infinite alternate;
  }
  /* Both animations peak at CHARACTER_PEAK_SCALE (1.035) and never above it —
     the per-character box sizes are computed against exactly that number, so
     raising either overshoot here would push the widest cut-outs past the edge
     of their tile. */
  @keyframes characterPop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.8);}
    60%{opacity:1; transform:translate(-50%,-50%) scale(1.035);}
    100%{opacity:1; transform:translate(-50%,-50%) scale(1);}
  }
  /* The art is sized to the tile now, so drifting it upwards would expose a
     strip of bare tile along the bottom and lap over the cell above; the idle
     motion breathes in place instead of translating. */
  @keyframes characterFloat{
    0%{transform:translate(-50%,-50%) scale(1);}
    100%{transform:translate(-50%,-50%) scale(1.035);}
  }

  /* The board is scaled to fit by fitBoardForCoach(), never cropped: a target
     the player cannot reach is a dead end, not a layout detail. */
  body.coaching #grid-wrap{
    max-width:92vw;
    margin-left:auto; margin-right:auto;
  }
  #grid-wrap.pattern-on .pattern-mark{display:block;}
  .cell.locked-pulse .piece,
  .cell.locked-pulse .cross-svg{animation:lockedPulse .4s ease;}
  @keyframes lockedPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    40%{transform:translate(-50%,-50%) scale(1.14);}
  }
  .cell.filled{cursor:default;}
  .cell.shake{animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-4px);} 40%{transform:translateX(4px);}
    60%{transform:translateX(-3px);} 80%{transform:translateX(3px);}
  }
  .floatpts{
    position:absolute; left:50%; top:20%; transform:translate(-50%,0);
    font-family:'Baloo 2'; font-weight:800; font-size:15px; color:var(--accent-dark);
    pointer-events:none; animation:floatUp .8s ease forwards; z-index:5;
  }
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,10px) scale(0.8);}
    20%{opacity:1; transform:translate(-50%,0) scale(1);}
    100%{opacity:0; transform:translate(-50%,-38px) scale(1);}
  }
  .banner-great{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    font-family:'Baloo 2'; font-weight:800; font-size:22px; color:var(--accent-2);
    text-shadow:0 2px 0 rgba(255,255,255,0.6);
    animation:bannerPop 1s ease forwards; z-index:6; pointer-events:none;
  }
  @keyframes bannerPop{
    0%{opacity:0; transform:translateX(-50%) scale(0.6);}
    25%{opacity:1; transform:translateX(-50%) scale(1.08);}
    35%{transform:translateX(-50%) scale(1);}
    80%{opacity:1;}
    100%{opacity:0; transform:translateX(-50%) scale(1) translateY(-10px);}
  }

  .bottombar{display:flex; gap:22px; margin-top:20px; align-items:flex-end;}
  .badge-btn{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
  .badge-circle{
    width:56px; height:56px; border-radius:50%; background:var(--card);
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow:0 3px 0 rgba(107,74,62,0.1);
    transition:background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .badge-btn:active .badge-circle{transform:translateY(2px); box-shadow:none;}
  #btn-place-mode:not(.disabled) .badge-circle{
    border-color:var(--accent);
    background:#FFF4E2;
    box-shadow:0 3px 0 rgba(224,134,47,.35);
  }
  #btn-place-mode.disabled .badge-circle{
    border-color:transparent;
    background:#E7E2DA;
    box-shadow:none;
  }
  .badge-btn.disabled .badge-count{
    opacity:.6;
  }
  .mode-cosmii{width:34px; height:34px; display:block; object-fit:contain;}
  #btn-place-mode:not(.disabled) .mode-cosmii{opacity:1; filter:none;}
  #btn-place-mode.disabled .mode-cosmii{opacity:.45; filter:grayscale(1);}
  #btn-place-mode:not(.disabled) .badge-label{color:var(--accent-dark);}
  #btn-place-mode.disabled .badge-label{color:#A59F95;}
  #btn-hint.disabled .badge-circle{
    border-color:transparent;
    background:#E7E2DA;
    box-shadow:none;
  }
  #btn-hint.disabled .badge-label,
  #btn-hint.disabled .badge-count{
    color:#A59F95;
    opacity:.6;
  }
  /* Off state is deliberately muted so the mode is readable at a glance. */
  #btn-place-mode .badge-circle{border:3px solid transparent; transition:.18s;}
  #btn-place-mode .mode-cosmii{opacity:.45; filter:grayscale(1); transition:.18s;}
  #btn-place-mode.on .badge-circle{
    border-color:var(--accent); background:#FFF4E2;
    box-shadow:0 3px 0 rgba(224,134,47,.35);
  }
  .badge-label{font-size:11px; font-weight:800; color:var(--text-muted);}
  .mode-cosmii{width:34px; height:34px; display:block; object-fit:contain;}
  /* Off state is deliberately muted so the mode is readable at a glance. */
  #btn-place-mode .badge-circle{border:3px solid transparent; transition:.18s;}
  #btn-place-mode .mode-cosmii{opacity:.45; filter:grayscale(1); transition:.18s;}
  #btn-place-mode.on .badge-circle{
    border-color:var(--accent); background:#FFF4E2;
    box-shadow:0 3px 0 rgba(224,134,47,.35);
  }
  #btn-place-mode.on .mode-cosmii{opacity:1; filter:none;}
  #btn-place-mode.on .badge-label{color:var(--accent-dark);}
  .badge-btn.disabled{opacity:.4; pointer-events:none;}

  /* ---------- Profile ---------- */
  .profile-card-wrap{width:320px; max-width:92vw; padding:0; overflow:hidden;}
  .profile-head{
    display:flex; align-items:center; justify-content:center; position:relative;
    background:var(--card-soft); padding:16px;
  }
  .profile-head h2{margin:0; font-size:22px;}
  .profile-head .settings-close{position:absolute; right:14px; top:50%; transform:translateY(-50%);}
  .profile-body{padding:18px 16px 20px;}
  .profile-idrow{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  /* The avatar sits inside its frame, so the frame colour is the wrapper's
     border and the image is inset — same construction as the picker tiles. */
  .profile-avatar{
    width:66px; height:66px; min-width:66px; border-radius:18px;
    border:4px solid var(--accent-2); overflow:hidden; background:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .profile-avatar img{width:100%; height:100%; object-fit:contain; display:block;}
  .profile-namebox{
    flex:1; display:flex; align-items:stretch; min-width:0;
    background:var(--card-soft); border-radius:14px; overflow:hidden;
  }
  #profile-name{
    flex:1; min-width:0; border:none; background:none; outline:none;
    font-family:'Baloo 2'; font-weight:700; font-size:19px; color:var(--text);
    text-align:center; padding:12px 6px;
  }
  #profile-name:disabled{color:var(--text); -webkit-text-fill-color:var(--text);}
  #btn-name-edit{
    border:none; cursor:pointer; width:52px; flex-shrink:0;
    background:#F7C97A; color:#fff; font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }
  #btn-name-edit.editing{background:var(--accent);}
  .profile-tabs{display:flex; gap:6px;}
  .profile-tab{
    flex:1; border:none; cursor:pointer; padding:12px 0;
    border-radius:14px 14px 0 0;
    background:var(--card-soft); color:var(--text-muted);
    font-weight:800; font-size:14px; font-family:'Nunito',sans-serif;
  }
  .profile-tab.on{background:#A97B58; color:#fff;}
  .profile-panel{
    background:var(--card-soft); border-radius:0 0 16px 16px;
    padding:14px 12px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  }
  .profile-tile{
    position:relative; aspect-ratio:1; border-radius:14px; cursor:pointer;
    border:4px solid transparent; overflow:hidden; background:#fff;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  .profile-tile:active{transform:scale(.94);}
  .profile-tile img{width:100%; height:100%; object-fit:contain; display:block;}
  .profile-tile.frame-tile{background:#F3E6D2;}
  .profile-tile.frame-tile::before{
    content:''; width:42%; height:42%; border-radius:50%;
    background:rgba(107,74,62,.10);
  }
  .profile-tile .tick{
    position:absolute; right:-2px; bottom:-2px; width:26px; height:26px;
    border-radius:50%; background:#25C26E; color:#fff;
    display:none; align-items:center; justify-content:center;
    font-size:14px; font-weight:900; border:2px solid #fff;
  }
  .profile-tile.selected .tick{display:flex;}
  .profile-tile .lock{
    position:absolute; inset:0; background:rgba(60,40,30,.55); color:#fff;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; font-family:'Baloo 2'; font-weight:700; font-size:11px;
  }
  .profile-tile.locked .lock{display:flex;}
  .profile-tile .lock img{width:14px; height:14px;}
  .profile-confirm{
    width:100%; margin-top:18px; padding:15px; border:none; border-radius:26px;
    background:var(--accent); color:#fff;
    font-family:'Baloo 2'; font-weight:700; font-size:18px; cursor:pointer;
    box-shadow:0 4px 0 rgba(200,110,20,.35);
  }
  .profile-confirm:active{transform:translateY(3px); box-shadow:none;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:absolute; inset:0; background:rgba(60,40,30,0.55);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:30;
  }
  .modal-overlay.active{opacity:1; pointer-events:auto;}
  .loading-overlay{
    position:absolute; inset:0; background:rgba(255,255,255,0.92);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:45;
  }
  .loading-overlay.active{
    opacity:1; pointer-events:auto;
  }
  .loading-card{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:20px 24px; border-radius:22px;
    background:#fff; box-shadow:0 18px 40px rgba(49,25,11,.15);
  }
  .loading-spinner{
    width:42px; height:42px; border:4px solid rgba(240,163,62,.25);
    border-top-color:var(--accent-dark); border-radius:50%; animation:spin .9s linear infinite;
  }
  .loading-text{
    font-size:16px; font-weight:800; color:var(--text);
  }
  @keyframes spin{100%{transform:rotate(360deg);}}
  .modal-card{
    background:var(--card); border-radius:22px; padding:26px 24px; width:min(92vw,360px); max-width:360px; text-align:center;
    transform:translateY(10px) scale(.96); transition:transform .25s ease;
  }
  .modal-overlay.active .modal-card{transform:translateY(0) scale(1);}
  .modal-card h2{font-family:'Baloo 2'; margin:2px 0 8px; font-size:22px;}
  .modal-card .time-big{font-size:28px; font-weight:800; color:var(--accent-dark); font-family:'Baloo 2';}
  .modal-card .best-line{color:var(--text-muted); font-size:13px; margin:4px 0 16px;}
  .modal-card .record{color:#3F9A5C; font-weight:900;}
  .modal-btn{width:100%; padding:12px; margin-top:8px; border:none; border-radius:14px;
    font-family:'Baloo 2'; font-weight:700; font-size:15px; cursor:pointer;}
  .modal-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff;}
  .modal-btn.secondary{background:var(--card-soft); color:var(--text);}

  /* ---------- Settings modal ---------- */
  .settings-card{width:100%; padding:22px 22px 24px; max-width:360px; text-align:left;}
  .settings-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .settings-head h2{margin:0;}
  .settings-close{background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer;}
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card-soft); border-radius:14px; padding:10px 14px; margin-bottom:8px;
  }
  .toggle-row .trow-label{font-weight:800; font-size:13px; display:flex; align-items:center; gap:8px;}
  .switch{position:relative; width:44px; height:24px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:#D9C4B0; border-radius:20px; cursor:pointer; transition:.2s;}
  .slider:before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{background:#3F9A5C;}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .feedback-btn{width:100%; padding:11px; border-radius:14px; border:2px solid var(--card-soft);
    background:none; color:var(--text); font-weight:800; font-size:13px; margin:10px 0 0; cursor:pointer;}
  .toast{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:60;
  }
  .toast.show{opacity:1;}

  /* ---------- Coach (interactive tutorial) ---------- */
  /* The player actually performs each gesture on the board, so the layer must
     never swallow taps: only the tip card and its buttons are clickable. */
  #grid-wrap.coach-focus .cell{opacity:.28; pointer-events:none;}
  #grid-wrap.coach-focus .cell.coach-target{opacity:1; pointer-events:auto; z-index:3;}
  #grid-wrap.coach-focus .cell.coach-done{opacity:1; pointer-events:none;}
  .cell.coach-target::after{
    content:''; position:absolute; inset:-3px; border-radius:11px;
    border:3px solid #fff; box-shadow:0 0 0 3px var(--accent), 0 0 14px rgba(240,163,62,.9);
    animation:coachPulse 1.15s ease-in-out infinite; pointer-events:none;
  }
  @keyframes coachPulse{
    0%,100%{transform:scale(1); opacity:1;}
    50%{transform:scale(1.09); opacity:.75;}
  }
  .coach{
    position:absolute; left:0; right:0; bottom:20px;
    display:none; flex-direction:column; align-items:center; gap:12px;
    padding:0 16px; z-index:55; pointer-events:none;
  }
  .coach.active{display:flex;}
  .coach-tip{
    background:#fff; border-radius:18px; padding:14px 18px; max-width:340px; text-align:center;
    font-weight:800; font-size:14px; line-height:1.65; color:var(--text);
    box-shadow:0 8px 24px rgba(107,74,62,.20); pointer-events:auto;
  }
  .coach-tip .kw{color:var(--danger);}
  .coach-tip .step{
    display:block; font-family:'Baloo 2'; font-size:11px; letter-spacing:1px;
    color:var(--text-muted); margin-bottom:4px;
  }
  .coach-tip .count.done{
    color:#25C26E; font-size:15px;
    animation:coachDone .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes coachDone{
    0%{transform:scale(.7); opacity:0;}
    60%{transform:scale(1.12); opacity:1;}
    100%{transform:scale(1); opacity:1;}
  }
  .coach-tip .count{
    display:block; margin-top:8px; font-family:'Baloo 2'; font-weight:700;
    font-size:14px; color:var(--accent-dark);
  }
  .coach-tip.nudge{animation:tipNudge .4s;}
  .coach-tip.step-clear{
    animation:tipClear .6s ease;
    box-shadow:0 8px 24px rgba(37,194,110,.28);
  }
  @keyframes tipClear{
    0%,100%{transform:scale(1);} 40%{transform:scale(1.035);}
  }
  @keyframes tipNudge{
    0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}
  }
  .coach-actions{display:flex; gap:10px; pointer-events:auto;}
  .coach-btn{
    border:none; border-radius:16px; padding:11px 26px; cursor:pointer;
    font-family:'Baloo 2'; font-weight:700; font-size:15px;
  }
  .coach-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff;}
  .coach-btn.ghost{background:rgba(255,255,255,.85); color:var(--text-muted); font-size:13px; padding:11px 18px;}
  /* The "next" button on an interactive step is an escape hatch, not the
     intended action, so it recedes until the step is actually done. */
  .coach-btn.primary.ghost{
    background:rgba(255,255,255,.85); color:var(--text-muted);
    font-size:13px; padding:11px 18px; box-shadow:none;
  }
  body.coaching .bottombar,
  body.coach-pending .bottombar{visibility:hidden;}
  body.coach-pending .rulecards{visibility:hidden;}
  body.coaching .topbar .circle-btn{opacity:.35; pointer-events:none;}
  /* The rule cards restate exactly what the tutorial is teaching, so hiding
     them during coaching buys back a whole row of vertical space. */
  body.coaching .rulecards{display:none;}
  /* Scaled from its top edge so the board can never slide under the tip
     sheet. Cells stay fully tappable at any scale. */
  #grid-wrap{transform-origin:top center; transition:transform .22s ease;}
  /* Without this a horizontal sweep is claimed by the browser as a pan or
     text selection and the paint stroke dies after the first cell. */
  #grid-wrap, .cell{touch-action:none;}
/* ---------- Splash screen ---------- */
#splash-screen{
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:absolute;
  inset:0;
  z-index:100;
}

.splash-logo{
  width:min(78vw,520px);
  height:auto;
}

.splash-start{
  position:absolute;
  bottom:60px;
  border:none;
  background:none;
  color:#c8c8c8;
  font-size:22px;
  cursor:pointer;
  animation:splashBlink 1.8s infinite;
}

@keyframes splashBlink{
  0%,100%{opacity:.35;}
  50%{opacity:1;}
}
</style>
</head>
<body>
<div id="app">

<div class="screen active" id="splash-screen">
  <img src="assets/images/AIRISGAMES.PNG"
       alt="AIRIS GAMES"
       class="splash-logo">

  <button id="btn-splash-start" class="splash-start" data-i18n="splash_start"></button>
</div>

  <!-- TITLE -->
  <div class="screen" id="title-screen">
    <div class="title-topbar">
      <div class="avatar-btn" id="btn-avatar">
        <img id="btn-avatar-img" src="assets/images/chara3_sub.PNG" alt="Cosmii Collection">
      </div>
      <div class="coin-chip" id="coin-chip">
        <img class="coin-icon" src="assets/images/CosmoCoin.PNG" alt="Cosmo Coin" aria-hidden="true">
        <span id="coin-balance">0</span>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle" id="lang-toggle">
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="circle-btn" id="btn-settings-title">⚙</button>
      </div>
    </div>

    <div class="title-cards">
      <div class="title-card daily locked" id="card-daily">
        <h3 data-i18n="daily_title"></h3>
        <div class="card-icon-wrap">
          <svg class="lock-icon" viewBox="0 0 24 30" fill="none"><rect x="2" y="12" width="20" height="16" rx="4" fill="#fff"/><path d="M6 12V8a6 6 0 0 1 12 0v4" stroke="#fff" stroke-width="3" fill="none"/></svg>
          <!-- Shown once the mode is unlocked; the padlock stayed up before, so
               an available mode still read as locked. -->
          <svg class="daily-icon" viewBox="0 0 60 60" fill="none"><circle cx="30" cy="30" r="26" fill="#fff" opacity=".95"/><path d="M25 20 L42 30 L25 40 Z" fill="#5B62B8"/></svg>
        </div>
        <div class="card-sub" id="daily-unlock-label"></div>
        <div class="card-check" id="daily-check" style="display:none;">✓</div>
      </div>
      <div class="title-card streak" id="card-streak">
        <h3 data-i18n="streak_title"></h3>
        <div class="card-icon-wrap">
          <svg class="sun-icon" viewBox="0 0 100 100">
            <path fill="#fff" opacity="0.9" d="M50 4 L57 22 L72 10 L68 29 L88 27 L74 40 L92 50 L74 60 L88 73 L68 71 L72 90 L57 78 L50 96 L43 78 L28 90 L32 71 L12 73 L26 60 L8 50 L26 40 L12 27 L32 29 L28 10 L43 22 Z"/>
            <circle cx="50" cy="50" r="24" fill="#fff"/>
          </svg>
        </div>
        <div class="card-count-pill" id="streak-count">1</div>
        <div class="card-check" id="streak-check" style="display:none;">✓</div>
      </div>
    </div>

    <div class="cosmii-wordmark">
      <img src="assets/images/CosmiiSudoku.PNG" alt="Cosmii Sudoku" class="cosmii-wordmark-image">
    </div>

    <!-- Label is set by renderTitleScreen(), which needs the cleared count to
         choose between START and the next-stage wording; no data-i18n here or
         applyLang would overwrite it with the plain START string. -->
    <button class="level-btn" id="btn-play" type="button"></button>

    <div class="promo-strip" id="promo-strip">
      <div class="promo-track" id="promo-track"></div>
      <div class="promo-dots" id="promo-dots"></div>
    </div>
  </div>

  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading...</div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="game-screen">
    <div class="topbar">
      <button class="circle-btn" id="btn-back">←</button>
      <div class="header-stats">
        <div class="header-stat"><div class="label" data-i18n="level_word"></div><div class="value" id="stat-level">1</div></div>
        <div class="header-stat"><div class="label" data-i18n="score_word"></div><div class="value" id="stat-score">0</div></div>
        <!-- The clear screen rates you on time and tracks a best, so the clock
             has to be visible while you are actually racing it. -->
        <div class="header-stat"><div class="label" data-i18n="time_word"></div><div class="value" id="stat-time">00:00</div></div>
      </div>
      <button class="circle-btn" id="btn-settings">⚙</button>
    </div>

    <div class="pillrow">
      <div class="pill"><img class="fortune-icon" src="assets/images/chara4_sub.PNG" alt="占い"> <span><span class="frac-cur" id="progress-cur">0</span>/<span id="progress-max">6</span></span></div>
      <div class="pill" id="stat-hearts"></div>
    </div>

    <div class="rulecards">
      <div class="rulecard">
        <div class="mini-grid">
          <div class="mini-cell">✕</div><div class="mini-cell">✕</div><div class="mini-cell">✕</div>
          <div class="mini-cell face"><div class="mini-face-dot"></div></div><div class="mini-cell">✕</div><div class="mini-cell">✕</div>
          <div class="mini-cell">✕</div><div class="mini-cell"></div><div class="mini-cell"></div>
        </div>
        <p data-i18n="rule_area"></p>
      </div>
      <div class="rulecard">
        <div class="mini-grid">
          <div class="mini-cell">✕</div><div class="mini-cell face"><div class="mini-face-dot"></div></div><div class="mini-cell">✕</div>
          <div class="mini-cell">✕</div><div class="mini-cell"></div><div class="mini-cell"></div>
          <div class="mini-cell">✕</div><div class="mini-cell"></div><div class="mini-cell"></div>
        </div>
        <p data-i18n="rule_line"></p>
      </div>
      <div class="rulecard">
        <div class="mini-grid">
          <div class="mini-cell">✕</div><div class="mini-cell">✕</div><div class="mini-cell">✕</div>
          <div class="mini-cell">✕</div><div class="mini-cell face"><div class="mini-face-dot"></div></div><div class="mini-cell">✕</div>
          <div class="mini-cell">✕</div><div class="mini-cell">✕</div><div class="mini-cell">✕</div>
        </div>
        <p data-i18n="rule_touch"></p>
      </div>
    </div>

    <div id="grid-wrap"></div>

    <div class="bottombar">
      <div class="badge-btn" id="btn-place-mode">
        <div class="badge-circle">
          <img class="mode-cosmii" src="assets/images/chara2_sub.PNG" alt="Cosmii Place Mode">
        </div>
        <div class="badge-count" id="place-count">3</div>
        <div class="badge-label" data-i18n="place_mode"></div>
      </div>
      <div class="badge-btn" id="btn-hint">
        <div class="badge-circle">✨</div>
        <div class="badge-count" id="hint-count">3</div>
        <div class="badge-label" data-i18n="hint"></div>
      </div>
    </div>
  </div>

  <!-- CLEAR MODAL -->
  <div class="modal-overlay" id="clear-modal">
    <div class="modal-card">
      <h2 class="display" data-i18n="clear_title"></h2>
      <div class="time-big" id="clear-time">00:00</div>
      <div class="best-line" id="clear-best"></div>
      <div class="coin-reward" id="coin-reward">
        <img class="coin-icon" src="assets/images/CosmoCoin.PNG" alt="Cosmo Coin" aria-hidden="true">
        <span class="coin-gain">+0</span>
        <span class="coin-total" id="coin-total"></span>
      </div>
      <!-- Where the coins came from. A flat, unexplained "+10" gave the player
           no reason to care about board size, streaks or their best time. -->
      <div class="coin-breakdown" id="coin-breakdown"></div>
      <button class="modal-btn primary" id="btn-next" data-i18n="next_puzzle"></button>
      <button class="modal-btn secondary" id="btn-menu-1" data-i18n="back_menu"></button>
    </div>
  </div>

  <!-- GAME OVER MODAL -->
  <div class="modal-overlay" id="over-modal">
    <div class="modal-card">
      <h2 class="display" data-i18n="over_title"></h2>
      <p class="best-line" data-i18n="over_body"></p>
      <button class="modal-btn primary" id="btn-retry" data-i18n="retry"></button>
      <button class="modal-btn secondary" id="btn-menu-2" data-i18n="back_menu"></button>
    </div>

<!-- Puzzle generation lives in its own inline script so it exists twice over,
     from a single copy of the source: it runs here on the main thread (which
     is the fallback path, and keeps these helpers available to the rest of the
     app), and its textContent is also read back to build a Web Worker. Carving
     an 11x11 board can occupy a core for a couple of seconds, and doing that on
     the main thread froze the loading spinner solid. -->
<script id="puzzle-src">
/* ---------------- Utility / RNG ---------------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(Math.imul(31,h)+s.charCodeAt(i))|0; } return h; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function randInt(min, max){ return min + Math.floor(Math.random()*(max-min+1)); }

/* ---------------- Puzzle generation ---------------- */
function generateSolution(n, rng){
  const cols = Array.from({length:n},(_,i)=>i);
  const solution = new Array(n).fill(-1);
  const usedCols = new Set();
  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function backtrack(row){
    if(row===n) return true;
    for(const c of shuffle(cols)){
      if(usedCols.has(c)) continue;
      if(row>0 && Math.abs(c-solution[row-1])===1) continue;
      solution[row]=c; usedCols.add(c);
      if(backtrack(row+1)) return true;
      usedCols.delete(c); solution[row]=-1;
    }
    return false;
  }
  return backtrack(0) ? solution.slice() : null;
}

// Difficulty is driven by the SHAPE of the colour regions, and the strongest
// single dial is how uneven their sizes are. A 1-cell region is a free gift:
// that cell must hold a Cosmii, which instantly kills a row, a column and its
// neighbours. Easy boards therefore get a couple of 1-cell regions plus a few
// large sprawling ones (e.g. 5x5 -> 1,1,2,10,11), which is exactly the shape
// of the reference screenshots. As levels rise the sizes even out, the free
// footholds disappear, and the player has to chain real deductions.
function makeTargetSizes(n, rng, smalls){
  const total = n*n;
  const small = smalls.slice(0, n-1);
  const bigCount = n - small.length;
  const remain = total - small.reduce((a,b)=>a+b,0);
  const base = Math.floor(remain/bigCount);
  const bigs = new Array(bigCount).fill(base);
  const extra = remain - base*bigCount;
  for(let i=0;i<extra;i++) bigs[i%bigCount]++;
  for(let k=0;k<bigCount;k++){          // light jitter so big regions aren't twins
    const i=(rng()*bigCount)|0, j=(rng()*bigCount)|0;
    if(i!==j && bigs[i]>2){ bigs[i]--; bigs[j]++; }
  }
  const all = small.concat(bigs);
  for(let i=all.length-1;i>0;i--){ const j=(rng()*(i+1))|0; [all[i],all[j]]=[all[j],all[i]]; }
  return all;
}

// `compact` (0..1) is the chance of growing a region into its most-connected
// neighbouring cell. High values give round, easy-to-read blobs; low values
// give thin winding shapes that are much harder to scan.
function generateRegions(n, solution, rng, targets, compact){
  const regionOf = Array.from({length:n},()=>new Array(n).fill(-1));
  const frontiers = Array.from({length:n},()=>new Set());
  const sizes = new Array(n).fill(1);
  const key=(r,c)=>r*n+c;
  const neighbors=(r,c)=>{
    const res=[];
    if(r>0) res.push([r-1,c]); if(r<n-1) res.push([r+1,c]);
    if(c>0) res.push([r,c-1]); if(c<n-1) res.push([r,c+1]);
    return res;
  };
  for(let reg=0; reg<n; reg++){
    const sc=solution[reg];
    regionOf[reg][sc]=reg;
    for(const [nr,nc] of neighbors(reg,sc)) if(regionOf[nr][nc]===-1) frontiers[reg].add(key(nr,nc));
  }
  let claimed=n; const total=n*n; let guard=0;
  while(claimed<total && guard<total*20){
    guard++;
    const active=[];
    for(let reg=0; reg<n; reg++){
      for(const k of Array.from(frontiers[reg])){
        const rr=(k/n)|0, cc=k%n;
        if(regionOf[rr][cc]!==-1) frontiers[reg].delete(k);
      }
      if(frontiers[reg].size>0) active.push(reg);
    }
    if(active.length===0) break;

    // Regions that already hit their target size stop growing, so the small
    // ones stay small. If everyone is full but cells remain, let anybody take
    // them rather than leaving holes.
    let want = active.filter(r=>sizes[r] < targets[r]);
    if(want.length===0) want = active;
    let reg;
    if(rng() < 0.85){
      let maxDef=-Infinity;
      for(const r of want){ const d=targets[r]-sizes[r]; if(d>maxDef) maxDef=d; }
      const best = want.filter(r=>targets[r]-sizes[r]===maxDef);
      reg = best[(rng()*best.length)|0];
    } else {
      reg = want[(rng()*want.length)|0];
    }

    const arr = Array.from(frontiers[reg]);
    let k;
    if(rng() < compact){
      let bestScore=-1, bestCells=[];
      for(const cand of arr){
        const rr=(cand/n)|0, cc=cand%n;
        let score=0;
        for(const [nr,nc] of neighbors(rr,cc)) if(regionOf[nr][nc]===reg) score++;
        if(score>bestScore){ bestScore=score; bestCells=[cand]; }
        else if(score===bestScore) bestCells.push(cand);
      }
      k = bestCells[(rng()*bestCells.length)|0];
    } else {
      k = arr[(rng()*arr.length)|0];
    }

    const rr=(k/n)|0, cc=k%n;
    regionOf[rr][cc]=reg; claimed++; sizes[reg]++;
    frontiers[reg].delete(k);
    for(const [nr,nc] of neighbors(rr,cc)) if(regionOf[nr][nc]===-1) frontiers[reg].add(key(nr,nc));
  }
  if(claimed<total) return null;
  return regionOf;
}

function countSolutions(n, regionOf, limit){
  const usedCols=new Set(), usedRegions=new Set();
  let count=0;
  function backtrack(row, prevCol){
    if(count>=limit) return;
    if(row===n){ count++; return; }
    for(let c=0;c<n;c++){
      if(usedCols.has(c)) continue;
      if(prevCol!==null && Math.abs(c-prevCol)===1) continue;
      const reg = regionOf[row][c];
      if(usedRegions.has(reg)) continue;
      usedCols.add(c); usedRegions.add(reg);
      backtrack(row+1,c);
      usedCols.delete(c); usedRegions.delete(reg);
      if(count>=limit) return;
    }
  }
  backtrack(0,null);
  return count;
}

// A puzzle can have exactly one solution yet still force a 50/50 guess partway
// through. This simulates a human solving purely by elimination, and also
// reports how often the harder "this region owns that row" inference was
// needed — a decent proxy for perceived difficulty.
function analyseSolvability(n, regionOf){
  const rowDone=new Array(n).fill(false), colDone=new Array(n).fill(false), regDone=new Array(n).fill(false);
  const dead=Array.from({length:n},()=>new Array(n).fill(false));
  let assigned=0, hardSteps=0;
  const alive=(r,c)=>!dead[r][c] && !rowDone[r] && !colDone[c] && !regDone[regionOf[r][c]];
  function place(r,c){
    rowDone[r]=true; colDone[c]=true; regDone[regionOf[r][c]]=true;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++) if(regionOf[i][j]===regionOf[r][c]) dead[i][j]=true;
    for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
      const ni=r+di,nj=c+dj; if(ni>=0&&ni<n&&nj>=0&&nj<n) dead[ni][nj]=true;
    }
    assigned++;
  }
  let progressed=true;
  while(progressed && assigned<n){
    progressed=false;
    for(let r=0;r<n&&!progressed;r++){
      if(rowDone[r]) continue;
      const cands=[]; for(let c=0;c<n;c++) if(alive(r,c)) cands.push(c);
      if(cands.length===1){ place(r,cands[0]); progressed=true; }
    }
    if(progressed) continue;
    for(let c=0;c<n&&!progressed;c++){
      if(colDone[c]) continue;
      const cands=[]; for(let r=0;r<n;r++) if(alive(r,c)) cands.push(r);
      if(cands.length===1){ place(cands[0],c); progressed=true; }
    }
    if(progressed) continue;
    for(let reg=0;reg<n&&!progressed;reg++){
      if(regDone[reg]) continue;
      const cands=[];
      for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(regionOf[r][c]===reg && alive(r,c)) cands.push([r,c]);
      if(cands.length===1){ place(cands[0][0],cands[0][1]); progressed=true; }
    }
    if(progressed) continue;
    // A region whose remaining candidates all sit in one row (or column) must
    // supply that line's Cosmii, so every other region's cells in that line
    // can be ruled out even before the exact cell is known.
    for(let reg=0;reg<n&&!progressed;reg++){
      if(regDone[reg]) continue;
      const cells=[];
      for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(regionOf[r][c]===reg && alive(r,c)) cells.push([r,c]);
      if(cells.length===0) continue;
      const rows=new Set(cells.map(p=>p[0]));
      if(rows.size===1){ const r=[...rows][0];
        for(let c=0;c<n;c++) if(regionOf[r][c]!==reg && alive(r,c)){ dead[r][c]=true; progressed=true; } }
      const cols=new Set(cells.map(p=>p[1]));
      if(cols.size===1){ const c=[...cols][0];
        for(let r=0;r<n;r++) if(regionOf[r][c]!==reg && alive(r,c)){ dead[r][c]=true; progressed=true; } }
      if(progressed) hardSteps++;
    }
    if(progressed) continue;
    // The mirror image: if every remaining candidate in a row (or column)
    // belongs to a single region, that region is spoken for by this line, so
    // its cells elsewhere are out. Large boards lean on this constantly.
    for(let r=0;r<n && !progressed; r++){
      if(rowDone[r]) continue;
      const gs=new Set();
      for(let c=0;c<n;c++) if(alive(r,c)) gs.add(regionOf[r][c]);
      if(gs.size===1){
        const g=[...gs][0];
        for(let i=0;i<n;i++) for(let j=0;j<n;j++)
          if(i!==r && regionOf[i][j]===g && alive(i,j)){ dead[i][j]=true; progressed=true; }
        if(progressed) hardSteps++;
      }
    }
    if(progressed) continue;
    for(let c=0;c<n && !progressed; c++){
      if(colDone[c]) continue;
      const gs=new Set();
      for(let r=0;r<n;r++) if(alive(r,c)) gs.add(regionOf[r][c]);
      if(gs.size===1){
        const g=[...gs][0];
        for(let i=0;i<n;i++) for(let j=0;j<n;j++)
          if(j!==c && regionOf[i][j]===g && alive(i,j)){ dead[i][j]=true; progressed=true; }
        if(progressed) hardSteps++;
      }
    }
  }
  return {solved:assigned===n, hardSteps};
}

function generatePuzzle(n, rng, smalls, compact, requireLogical, minSolo, maxHard){
  const outerN = n<=6 ? 80 : 60;
  const innerN = n<=6 ? 60 : 60;
  for(let a=0;a<outerN;a++){
    const solution = generateSolution(n, rng);
    if(!solution) continue;
    for(let b=0;b<innerN;b++){
      const targets = makeTargetSizes(n, rng, smalls);
      const regionOf = generateRegions(n, solution, rng, targets, compact);
      if(!regionOf) continue;
      if(minSolo){
        // A 1-cell region is a free, self-evident placement. Early levels need
        // several of them: with only one, the rest of the board still demands
        // a full chain of deductions, which is too much for a first puzzle.
        const sz = new Array(n).fill(0);
        for(let r=0;r<n;r++) for(let c=0;c<n;c++) sz[regionOf[r][c]]++;
        if(sz.filter(x=>x===1).length < minSolo) continue;
      }
      if(countSolutions(n, regionOf, 2)!==1) continue;
      const info = analyseSolvability(n, regionOf);
      if(requireLogical && !info.solved) continue; // never force a blind guess
      // maxHard caps how often the harder "this region owns that line"
      // inference is needed. 0 means plain elimination is always enough.
      if(maxHard !== undefined && info.hardSteps > maxHard) continue;
      return {n, solution, regionOf};
    }
  }
  return null;
}

// Generation can miss its attempt budget on unlucky seeds. Rather than ever
// showing the player an error, relax the recipe step by step: nudge shapes
// rounder, then allow an extra small region, then drop the strict
// no-guessing rule, then finally shrink the board.
/* ---------------- Large boards (8x8 and up) ----------------
   Growing regions at random and hoping for a unique solution collapses past
   7x7: measured over three seconds, roughly 1 layout in 2,500 is unique at
   8x8 and none at all at 9x9 or beyond. Big boards are therefore *carved*
   instead — take any layout, repeatedly find a rival solution, and delete it
   by moving one of its cells into a neighbouring region that already hosts
   one of its queens. The intended solution is never touched, so it survives
   every edit.
------------------------------------------------------------- */
function cellNeighbors(n,r,c){
  const res=[];
  if(r>0) res.push([r-1,c]); if(r<n-1) res.push([r+1,c]);
  if(c>0) res.push([r,c-1]); if(c<n-1) res.push([r,c+1]);
  return res;
}
// Rows fill top to bottom and the only cross-row coupling is that neighbouring
// rows must sit 2+ columns apart, so the whole search state is (columns used,
// regions used, previous column). Many different orderings reach the same
// state, which makes memoising dead ends enormously effective — this is what
// takes an 11x11 search from minutes to milliseconds.
function findRivalSolution(n, regionOf, avoid){
  const dead = new Set();
  const cur = new Array(n);
  let found = null;
  function rec(row, colMask, regMask, prev, diverged){
    if(row===n){ if(diverged){ found=cur.slice(); return true; } return false; }
    const key = ((colMask*2048 + regMask)*16 + (prev+1))*2 + (diverged?1:0);
    if(dead.has(key)) return false;
    for(let c=0;c<n;c++){
      if(colMask & (1<<c)) continue;
      if(prev>=0 && Math.abs(c-prev)<=1) continue;
      const g = regionOf[row][c];
      if(regMask & (1<<g)) continue;
      cur[row]=c;
      if(rec(row+1, colMask|(1<<c), regMask|(1<<g), c, diverged || c!==avoid[row])) return true;
    }
    dead.add(key);
    return false;
  }
  rec(0,0,0,-1,false);
  return found;
}
// Flood fill from one surviving cell and compare counts. Uses a flat typed
// array and inlined neighbour steps: this runs inside the carve loop tens of
// thousands of times on a big board, so allocating arrays here was costing
// more than the search itself.
const _seen = new Uint8Array(16*16);
function regionStaysWhole(n, regionOf, g, skipR, skipC){
  let total=0, startR=-1, startC=-1;
  for(let r=0;r<n;r++){
    const row=regionOf[r];
    for(let c=0;c<n;c++){
      if(row[c]!==g || (r===skipR && c===skipC)) continue;
      total++;
      if(startR<0){ startR=r; startC=c; }
    }
  }
  if(!total) return false;
  _seen.fill(0, 0, n*n);
  const stack=[startR*n+startC];
  _seen[startR*n+startC]=1;
  let reached=0;
  while(stack.length){
    const k=stack.pop(); reached++;
    const r=(k/n)|0, c=k%n;
    if(r>0)   { const nk=k-n; if(!_seen[nk] && regionOf[r-1][c]===g && !(r-1===skipR&&c===skipC)){_seen[nk]=1;stack.push(nk);} }
    if(r<n-1) { const nk=k+n; if(!_seen[nk] && regionOf[r+1][c]===g && !(r+1===skipR&&c===skipC)){_seen[nk]=1;stack.push(nk);} }
    if(c>0)   { const nk=k-1; if(!_seen[nk] && regionOf[r][c-1]===g && !(r===skipR&&c-1===skipC)){_seen[nk]=1;stack.push(nk);} }
    if(c<n-1) { const nk=k+1; if(!_seen[nk] && regionOf[r][c+1]===g && !(r===skipR&&c+1===skipC)){_seen[nk]=1;stack.push(nk);} }
  }
  return reached===total;
}
function carveUnique(n, regionOf, solution, rng, maxEdits){
  for(let it=0; it<maxEdits; it++){
    const rival = findRivalSolution(n, regionOf, solution);
    if(!rival) return true;
    const rows=[];
    for(let r=0;r<n;r++) if(rival[r]!==solution[r]) rows.push(r);
    for(let i=rows.length-1;i>0;i--){ const j=(rng()*(i+1))|0; [rows[i],rows[j]]=[rows[j],rows[i]]; }
    // Which regions the rival already occupies — computed once per edit
    // rather than rescanned for every candidate neighbour.
    const rivalHosts = new Uint8Array(n);
    for(let rr=0;rr<n;rr++) rivalHosts[regionOf[rr][rival[rr]]] = 1;

    let moved=false, fallback=null;
    for(const r of rows){
      const c=rival[r], g=regionOf[r][c];
      // Connectivity is a property of (g, r, c) alone, so test it once up
      // front and skip the cell entirely if removing it would split g.
      if(!regionStaysWhole(n,regionOf,g,r,c)) continue;
      const good=[], any=[];
      for(const [nr,nc] of cellNeighbors(n,r,c)){
        const h=regionOf[nr][nc];
        if(h===g || any.indexOf(h)>=0) continue;
        any.push(h);
        // Moving the cell into a region the rival already uses makes the
        // rival illegal outright; that is the edit we want.
        if(rivalHosts[h] && regionOf[r][c]!==h) good.push(h);
      }
      if(good.length){ regionOf[r][c]=good[(rng()*good.length)|0]; moved=true; break; }
      if(!fallback && any.length) fallback=[r,c,any];
    }
    if(!moved){
      if(!fallback) return false;
      const [r,c,any]=fallback;
      regionOf[r][c]=any[(rng()*any.length)|0];
    }
  }
  return findRivalSolution(n, regionOf, solution)===null;
}
// A freshly carved board is only *barely* unique, which usually means it needs
// deep reasoning. Trimming a cell off a large region tightens the constraints
// and tends to open up a plain elimination path, so shave cells until the
// deduction solver can finish unaided.
function trimOneCell(n, regionOf, solution, rng){
  const order=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(solution[r]!==c) order.push([r,c]);
  for(let i=order.length-1;i>0;i--){ const j=(rng()*(i+1))|0; [order[i],order[j]]=[order[j],order[i]]; }
  const size=new Array(n).fill(0);
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) size[regionOf[r][c]]++;
  for(const [r,c] of order){
    const g=regionOf[r][c];
    if(size[g]<=2) continue;
    const cand=[];
    for(const [nr,nc] of cellNeighbors(n,r,c)){
      const h=regionOf[nr][nc];
      if(h!==g && cand.indexOf(h)<0) cand.push(h);
    }
    if(!cand.length || !regionStaysWhole(n,regionOf,g,r,c)) continue;
    regionOf[r][c]=cand[(rng()*cand.length)|0];
    return true;
  }
  return false;
}
function generateLargePuzzle(cfg, rng, budgetMs){
  const n = cfg.n;
  const t0 = Date.now();
  while(Date.now()-t0 < budgetMs){
    const solution = generateSolution(n, rng);
    if(!solution) continue;
    const targets = makeTargetSizes(n, rng, cfg.smalls);
    const regionOf = generateRegions(n, solution, rng, targets, cfg.compact);
    if(!regionOf) continue;
    if(!carveUnique(n, regionOf, solution, rng, 600)) continue;
    for(let k=0; k<80 && Date.now()-t0 < budgetMs; k++){
      if(analyseSolvability(n, regionOf).solved) return {n, solution, regionOf};
      if(!trimOneCell(n, regionOf, solution, rng)) break;
      // trimOneCell only ever shrinks a region, which can revive a rival, so
      // re-carve — but carveUnique already returns immediately when there is
      // no rival, making a separate check redundant.
      if(!carveUnique(n, regionOf, solution, rng, 300)) break;
    }
  }
  return null;
}

function generatePuzzleRobust(cfg, rng){
  const n = cfg.n;
  if(n >= 8){
    const big = generateLargePuzzle(cfg, rng, 2500);
    if(big) return big;
    // Never surface a failure: drop back to a size the classic path nails.
    return generatePuzzle(7, rng, [1,2], 0.5, true, 0, undefined)
        || generatePuzzle(6, rng, [1,2], 0.6, false, 0, undefined);
  }
  const solo = cfg.minSolo || 0;
  const hard = cfg.maxHard;
  const plans = [
    {n, smalls:cfg.smalls,            compact:cfg.compact,                     logical:true,  solo,     hard},
    {n, smalls:cfg.smalls,            compact:Math.min(0.75, cfg.compact+0.2), logical:true,  solo,     hard},
    {n, smalls:cfg.smalls,            compact:cfg.compact,                     logical:true,  solo,     hard:undefined},
    {n, smalls:[1,1,2],               compact:0.55,                            logical:true,  solo:Math.min(solo,1), hard:undefined},
    {n, smalls:cfg.smalls,            compact:cfg.compact,                     logical:false, solo:0,   hard:undefined},
    {n:Math.max(4,n-1), smalls:[1,2], compact:0.55,                            logical:false, solo:0,   hard:undefined},
  ];
  for(const p of plans){
    const r = generatePuzzle(p.n, rng, p.smalls, p.compact, p.logical, p.solo, p.hard);
    if(r) return r;
  }
  return null;
}

/* Worker entry point. Guarded so it is inert when this same source runs on
   the main thread, where `importScripts` (and `onmessage`) do not exist. */
if(typeof importScripts === 'function'){
  self.onmessage = function(e){
    const {id, cfg, seed} = e.data;
    try{
      self.postMessage({id, puzzle: generatePuzzleRobust(cfg, mulberry32(seed))});
    }catch(err){
      self.postMessage({id, puzzle: null, error: String(err && err.message || err)});
    }
  };
}

<script>
/* ---------------- Puzzle generation, off the main thread ----------------
   The worker is built from the generation script's own text, so there is one
   copy of the algorithm and no second file to keep in sync. If a Worker cannot
   be created — blocked by a policy, or the source element is missing — we fall
   straight back to running the very same function synchronously, which is only
   what the game did before.
------------------------------------------------------------------------- */
let _puzzleWorker = null, _puzzleWorkerDead = false, _puzzleReqId = 0;
function puzzleWorker(){
  if(_puzzleWorker || _puzzleWorkerDead) return _puzzleWorker;
  try{
    const src = document.getElementById('puzzle-src').textContent;
    const url = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
    _puzzleWorker = new Worker(url);
    URL.revokeObjectURL(url);
    _puzzleWorker.onerror = ()=>{ _puzzleWorkerDead = true; _puzzleWorker = null; };
  }catch(e){
    console.warn('puzzle worker unavailable, generating inline:', e);
    _puzzleWorkerDead = true;
  }
  return _puzzleWorker;
}
// Warm the worker up while the player is still on the title screen, so the
// first board does not pay for spawning it.
function warmPuzzleWorker(){ try{ puzzleWorker(); }catch(e){} }

function generatePuzzleAsync(cfg, seed){
  const w = puzzleWorker();
  if(!w) return Promise.resolve(generatePuzzleRobust(cfg, mulberry32(seed)));
  return new Promise(resolve=>{
    const id = ++_puzzleReqId;
    let settled = false;
    const done = (puzzle)=>{
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      w.removeEventListener('message', onMessage);
      resolve(puzzle);
    };
    const onMessage = (e)=>{ if(e.data && e.data.id === id) done(e.data.puzzle); };
    // A wedged worker must not strand the player on a spinner. The generator's
    // own budget is 2.5s, so anything past 10s means the worker is gone.
    const timer = setTimeout(()=>{
      console.warn('puzzle worker timed out, generating inline');
      _puzzleWorkerDead = true; _puzzleWorker = null;
      try{ w.terminate(); }catch(e){}
      done(generatePuzzleRobust(cfg, mulberry32(seed)));
    }, 10000);
    w.addEventListener('message', onMessage);
    w.postMessage({id, cfg, seed});
  });
}

/* ---------------- Level ladder ----------------
   smalls  = target sizes of the deliberately tiny regions (free footholds)
   compact = how blobby/readable the regions are (high = easier to scan)
   Lv1-3 mirror the reference boards: 5x5 / 5x5 / 6x6 with two 1-cell
   regions and a couple of big ones, generous hints, occasional given.
------------------------------------------------ */
function levelToConfig(level){
  // minSolo = how many 1-cell regions must exist (free, obvious placements)
  // maxHard = 0 means plain "only one candidate left" elimination solves it,
  //           with no pigeonhole reasoning needed anywhere.
  // Lv1 is the fixed 4x4 tutorial board. Note there are only two legal Cosmii
  // arrangements on a 4x4 at all, so the colours vary but the answer pattern
  // does not — which is fine for a first board and deliberate.
  if(level<=1) return {n:4, smalls:[1,1],   compact:0.80, hearts:3, hints:3, prefillChance:0,    prefillMax:1, minSolo:2, maxHard:0};
  if(level<=2) return {n:5, smalls:[1,1,2], compact:0.80, hearts:3, hints:3, prefillChance:0.35, prefillMax:1, minSolo:2, maxHard:0};
  if(level<=3) return {n:6, smalls:[1,1,2], compact:0.80, hearts:3, hints:3, prefillChance:0.45, prefillMax:1, minSolo:2, maxHard:1};
  if(level<=5) return {n:6, smalls:[1,2],   compact:0.70, hearts:3, hints:3, prefillChance:0.30, prefillMax:1, minSolo:1};
  // From Lv6 the board size is drawn at random each time, with 11x11 in the
  // mix and the pool shifting larger as levels climb. Bigger boards get an
  // extra life and extra hints, since a single slip costs far more there.
  let pool;
  if(level<=7)      pool=[6,6,7,7,8,9,11];
  else if(level<=10)pool=[7,7,8,8,9,10,11,11];
  else              pool=[7,8,8,9,9,10,11,11,11];
  const n = pool[(Math.random()*pool.length)|0];
  if(n <= 7){
    return {n, smalls:[1,2], compact: level<=7 ? 0.55 : (level<=10 ? 0.50 : 0.35),
            hearts:3, hints:3, prefillChance:0.15, prefillMax:1};
  }
  // More small regions up front means the first layout is already close to
  // uniquely solvable, so the carve loop has far less to undo. Measured on
  // 11x11 this alone cut median generation from ~200ms to ~8ms.
  return {n, smalls: n>=10 ? [1,1,1,1,2,2] : [1,1,1,2,2], compact:0.65,
          hearts:3, hints: n>=10 ? 5 : 4,
          prefillChance:0, prefillMax:1};
}

/* ---------------- Storage ----------------
   Everything persistent goes through whichever backend the host actually
   provides: Capacitor Preferences when that plugin is installed, then any
   injected window.storage, then localStorage (which WKWebView keeps across
   launches for a Capacitor app, and which is what a plain browser gets).
   The backend is resolved on first use rather than at parse time, so a native
   bridge that lands late is still picked up.
------------------------------------------- */
const STORAGE_PREFIX = 'cosmii-sudoku:';
let _storageBackend = null;
function storageBackend(){
  if(_storageBackend) return _storageBackend;
  const prefs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
  if(prefs){
    _storageBackend = {
      async get(k){ const r = await prefs.get({key:STORAGE_PREFIX+k}); return r ? r.value : null; },
      async set(k,v){ await prefs.set({key:STORAGE_PREFIX+k, value:v}); },
    };
  } else if(window.storage && typeof window.storage.get === 'function'){
    _storageBackend = {
      async get(k){ const r = await window.storage.get(k, false); return r ? r.value : null; },
      async set(k,v){ await window.storage.set(k, v, false); },
    };
  } else {
    _storageBackend = {
      async get(k){ return localStorage.getItem(STORAGE_PREFIX+k); },
      async set(k,v){ localStorage.setItem(STORAGE_PREFIX+k, v); },
    };
  }
  return _storageBackend;
}
async function loadJSON(key, fallback){
  try{
    const raw = await storageBackend().get(key);
    if(raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  }catch(e){
    // A failed read must never be silent: it used to hide the fact that the
    // storage object did not exist at all, so nothing was ever saved.
    console.warn('storage read failed:', key, e);
    return fallback;
  }
}
async function saveJSON(key, obj){
  try{ await storageBackend().set(key, JSON.stringify(obj)); }
  catch(e){ console.warn('storage write failed:', key, e); }
}

/* ---------------- Sound / haptics ---------------- */
let audioCtx=null;
function beep(freq, dur, type){
  if(!settings.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

   the platform this ships on — the vibration setting used to be a no-op with a
   switch in front of it. Route through @capacitor/haptics when the native
   bridge is there, keep navigator.vibrate for the browser build, and report
   whether anything is actually available so the settings row can hide itself
   rather than lie. */
function hapticsPlugin(){
  return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) || null;
}
function hapticsAvailable(){ return !!(hapticsPlugin() || navigator.vibrate); }
function vibrate(ms){
  if(!settings.vibrate) return;
  const h = hapticsPlugin();
  if(h){
    // The native API is a style, not a duration; map the three intensities the
    // game actually uses (light paint tick, medium confirm, heavy mistake).
    const style = ms >= 60 ? 'HEAVY' : (ms >= 15 ? 'MEDIUM' : 'LIGHT');
    try{ h.impact({style}); }catch(e){}
    return;
  }

}

function openExternal(url){

}

/* ---------------- Game state ---------------- */
// Twelve hues spread evenly around the wheel with alternating lightness, so
// that even neighbouring hues separate on brightness alone. Measured in CIELAB
// the closest pair here is dE 28; the previous palette had a pair at dE 18,
// which is where the "these two look identical" indigo/violet clash came from.
const COLORS = ['#2E9FD4','#63C24A','#E8AB0E','#E04236','#9B4FCB','#128A5E',
                '#F27C1B','#2E48B5','#DA4B8C','#2FC9BC','#8A6238','#AFC70F'];
const SHAPE_GLYPHS = ['●','▲','■','◆','★','⬟','⬢','✚','⬣','◐','▼','⬤'];

// Perceptual (CIELAB) distance between two palette entries. Plain RGB distance
// badly misjudges how similar colours actually look.
const LAB = COLORS.map(hex=>{
  const v = [1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255)
    .map(x=> x>0.04045 ? Math.pow((x+0.055)/1.055, 2.4) : x/12.92);
  const X=(v[0]*0.4124+v[1]*0.3576+v[2]*0.1805)/0.95047;
  const Y= v[0]*0.2126+v[1]*0.7152+v[2]*0.0722;
  const Z=(v[0]*0.0193+v[1]*0.1192+v[2]*0.9505)/1.08883;
  const f=t=> t>0.008856 ? Math.cbrt(t) : (7.787*t+16/116);
  return [116*f(Y)-16, 500*(f(X)-f(Y)), 200*(f(Y)-f(Z))];
});
function labDist(a,b){
  return Math.hypot(LAB[a][0]-LAB[b][0], LAB[a][1]-LAB[b][1], LAB[a][2]-LAB[b][2]);
}

// Every region on the board gets its own colour — never a repeat, even between
// regions that don't touch. Two same-coloured blobs read as one region no
// matter how far apart they sit, which makes "one Cosmii per zone" unreadable.
// With at most 11 regions and 12 hues this is always possible, and we pick the
// subset that maximises the closest pair so small boards look wildly distinct.
function assignColors(n, regionOf, rng){
  const total = COLORS.length;
  let best=null, bestScore=-1;
  for(let seed=0; seed<total; seed++){
    const sel=[seed];
    while(sel.length < n){
      let pick=-1, pickScore=-1;
      for(let i=0;i<total;i++){
        if(sel.indexOf(i)>=0) continue;
        let nearest=Infinity;
        for(const s of sel) nearest = Math.min(nearest, labDist(i,s));
        if(nearest > pickScore){ pickScore=nearest; pick=i; }
      }
      sel.push(pick);
    }
    let score=Infinity;
    for(let i=0;i<sel.length;i++) for(let j=i+1;j<sel.length;j++)
      score = Math.min(score, labDist(sel[i], sel[j]));
    if(score > bestScore){ bestScore=score; best=sel; }
  }
  // Shuffle so the same board size doesn't always wear the same colours,
  // then hand the most contrasting pairs to regions that actually touch.
  const pool = best.slice();
  for(let i=pool.length-1;i>0;i--){ const j=(rng()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }

  const adj = Array.from({length:n},()=>new Set());
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const g = regionOf[r][c];
    if(r+1<n){ const h=regionOf[r+1][c]; if(h!==g){ adj[g].add(h); adj[h].add(g); } }
    if(c+1<n){ const h=regionOf[r][c+1]; if(h!==g){ adj[g].add(h); adj[h].add(g); } }
  }
  const order = Array.from({length:n},(_,i)=>i).sort((a,b)=>adj[b].size-adj[a].size);
  const out = new Array(n).fill(-1);
  const free = pool.slice();
  for(const g of order){
    let bestIdx=0, bestSep=-1;
    for(let i=0;i<free.length;i++){
      let sep=Infinity;
      for(const h of adj[g]) if(out[h]>=0) sep=Math.min(sep, labDist(free[i], out[h]));
      if(sep===Infinity) sep = 1000;               // no coloured neighbour yet
      if(sep > bestSep){ bestSep=sep; bestIdx=i; }
    }
    out[g] = free.splice(bestIdx,1)[0];
  }
  return out;
}

let state = null;
let timerHandle = null;
let bestTimes = {};
/* ---------------- Cosmo Coin economy ----------------
   A flat 10 per clear against 1000-coin avatars meant 700 clears to own
   everything, which made the whole unlock system decorative. The reward now
   scales with the board you actually solved and pays out for the things worth
   encouraging — coming back daily, and beating your own time.

   Rough pacing at these numbers: a 6x6 clear pays 32, an 11x11 pays 52, and a
   week-long streak adds 35 on top. First frame at ~5 clears, first avatar at
   ~12, the full set (2300) somewhere around 40-60.
------------------------------------------------------ */
const COIN_BASE          = 8;    // flat part of a clear
const COIN_PER_ROW       = 4;    // ...plus this much per board row
const COIN_DAILY_MULT    = 2;    // the daily challenge is worth double
const COIN_RECORD_BONUS  = 15;   // beat your own best time for this size
const COIN_STREAK_PER_DAY= 5;
const COIN_STREAK_CAP    = 7;    // streak bonus stops growing after a week

// Returns the total and an itemised list, so the clear screen can show the
// player why they earned what they earned.
function clearReward({n, isDaily, isRecord, streak}){
  const parts = [];
  let base = COIN_BASE + COIN_PER_ROW * n;
  if(isDaily) base *= COIN_DAILY_MULT;
  parts.push({key:'reward_clear', amount:base});
  const bonus = Math.min(streak||0, COIN_STREAK_CAP) * COIN_STREAK_PER_DAY;
  if(bonus > 0) parts.push({key:'reward_streak', amount:bonus});
  if(isRecord) parts.push({key:'reward_record', amount:COIN_RECORD_BONUS});
  return {total: parts.reduce((a,p)=>a+p.amount, 0), parts};
}
