<script>
/* ---------------- Puzzle generation, off the main thread ----------------
   The worker is built from the generation script's own text, so there is one
   copy of the algorithm and no second file to keep in sync. If a Worker cannot
   be created — blocked by a policy, or the source element is missing — we fall
   straight back to running the very same function synchronously, which is only
   what the game did before.
------------------------------------------------------------------------- */
// Defined further down, so bind late: this block runs before the analytics
// module and must not depend on its load order.
function reportWorkerIssue(msg){
  if(typeof gaError === 'function') gaError(msg, 'Warning');
}
let _puzzleWorker = null, _puzzleWorkerDead = false, _puzzleReqId = 0;
function puzzleWorker(){
  if(_puzzleWorker || _puzzleWorkerDead) return _puzzleWorker;
  try{
    const src = document.getElementById('puzzle-src').textContent;
    const url = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
    _puzzleWorker = new Worker(url);
    URL.revokeObjectURL(url);
    _puzzleWorker.onerror = ()=>{ _puzzleWorkerDead = true; _puzzleWorker = null; };
  }catch(e){
    console.warn('puzzle worker unavailable, generating inline:', e);
    _puzzleWorkerDead = true;
    reportWorkerIssue('worker unavailable: ' + (e && e.message || e));
  }
  return _puzzleWorker;
}
// Warm the worker up while the player is still on the title screen, so the
// first board does not pay for spawning it.
function warmPuzzleWorker(){ try{ puzzleWorker(); }catch(e){} }

function generatePuzzleAsync(cfg, seed){
  const w = puzzleWorker();
  if(!w) return Promise.resolve(runGeneration(cfg, mulberry32(seed)));
  return new Promise(resolve=>{
    const id = ++_puzzleReqId;
    let settled = false;
    const done = (puzzle)=>{
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      w.removeEventListener('message', onMessage);
      resolve(puzzle);
    };
    const onMessage = (e)=>{ if(e.data && e.data.id === id) done(e.data.puzzle); };
    // A wedged worker must not strand the player on a spinner. The generator's
    // own budget is 2.5s, so anything past 10s means the worker is gone.
    const timer = setTimeout(()=>{
      console.warn('puzzle worker timed out, generating inline');
      reportWorkerIssue('worker timed out n=' + cfg.n);
      _puzzleWorkerDead = true; _puzzleWorker = null;
      try{ w.terminate(); }catch(e){}
      done(runGeneration(cfg, mulberry32(seed)));
    }, 10000);
    w.addEventListener('message', onMessage);
    w.postMessage({id, cfg, seed});
  });
}

/* ---------------- Level ladder ----------------
   smalls  = target sizes of the deliberately tiny regions (free footholds)
   compact = how blobby/readable the regions are (high = easier to scan)
   Lv1-3 mirror the reference boards: 5x5 / 5x5 / 6x6 with two 1-cell
   regions and a couple of big ones, generous hints, occasional given.
------------------------------------------------ */
function levelToConfig(level){
  // minSolo = how many 1-cell regions must exist (free, obvious placements)
  // maxHard = 0 means plain "only one candidate left" elimination solves it,
  //           with no pigeonhole reasoning needed anywhere.
  // Lv1 is the fixed 4x4 tutorial board. Note there are only two legal Cosmii
  // arrangements on a 4x4 at all, so the colours vary but the answer pattern
  // does not — which is fine for a first board and deliberate.
  if(level<=1) return {n:4, smalls:[1,1],   compact:0.80, hearts:3, hints:3, prefillChance:0,    prefillMax:1, minSolo:2, maxHard:0};
  if(level<=2) return {n:5, smalls:[1,1,2], compact:0.80, hearts:3, hints:3, prefillChance:0.35, prefillMax:1, minSolo:2, maxHard:0};
  if(level<=3) return {n:6, smalls:[1,1,2], compact:0.80, hearts:3, hints:3, prefillChance:0.45, prefillMax:1, minSolo:2, maxHard:1};
  if(level<=5) return {n:6, smalls:[1,2],   compact:0.70, hearts:3, hints:3, prefillChance:0.30, prefillMax:1, minSolo:1};
  // From Lv6 the board size is drawn at random each time, with 11x11 in the
  // mix and the pool shifting larger as levels climb. Bigger boards get an
  // extra life and extra hints, since a single slip costs far more there.
  let pool;
  if(level<=7)      pool=[6,6,7,7,8,9,11];
  else if(level<=10)pool=[7,7,8,8,9,10,11,11];
  else              pool=[7,8,8,9,9,10,11,11,11];
  const n = pool[(Math.random()*pool.length)|0];
  if(n <= 7){
    return {n, smalls:[1,2], compact: level<=7 ? 0.55 : (level<=10 ? 0.50 : 0.35),
            hearts:3, hints:3, prefillChance:0.15, prefillMax:1};
  }
  // More small regions up front means the first layout is already close to
  // uniquely solvable, so the carve loop has far less to undo. Measured on
  // 11x11 this alone cut median generation from ~200ms to ~8ms.
  return {n, smalls: n>=10 ? [1,1,1,1,2,2] : [1,1,1,2,2], compact:0.65,
          hearts:3, hints: n>=10 ? 5 : 4,
          prefillChance:0, prefillMax:1};
}

/* ---------------- Storage ----------------
   Everything persistent goes through whichever backend the host actually
   provides: Capacitor Preferences when that plugin is installed, then any
   injected window.storage, then localStorage (which WKWebView keeps across
   launches for a Capacitor app, and which is what a plain browser gets).
   The backend is resolved on first use rather than at parse time, so a native
   bridge that lands late is still picked up.
------------------------------------------- */
const STORAGE_PREFIX = 'cosmii-sudoku:';
let _storageBackend = null;
function storageBackend(){
  if(_storageBackend) return _storageBackend;
  const prefs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences;
  if(prefs){
    _storageBackend = {
      async get(k){ const r = await prefs.get({key:STORAGE_PREFIX+k}); return r ? r.value : null; },
      async set(k,v){ await prefs.set({key:STORAGE_PREFIX+k, value:v}); },
    };
  } else if(window.storage && typeof window.storage.get === 'function'){
    _storageBackend = {
      async get(k){ const r = await window.storage.get(k, false); return r ? r.value : null; },
      async set(k,v){ await window.storage.set(k, v, false); },
    };
  } else {
    _storageBackend = {
      async get(k){ return localStorage.getItem(STORAGE_PREFIX+k); },
      async set(k,v){ localStorage.setItem(STORAGE_PREFIX+k, v); },
    };
  }
  return _storageBackend;
}
async function loadJSON(key, fallback){
  try{
    const raw = await storageBackend().get(key);
    if(raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  }catch(e){
    // A failed read must never be silent: it used to hide the fact that the
    // storage object did not exist at all, so nothing was ever saved.
    console.warn('storage read failed:', key, e);
    return fallback;
  }
}
async function saveJSON(key, obj){
  try{ await storageBackend().set(key, JSON.stringify(obj)); }
  catch(e){ console.warn('storage write failed:', key, e); }
}

/* ---------------- Sound / haptics ---------------- */
const BGM_VOLUME = 0.20;
const SFX_VOLUME = {
  tap: 0.36,
  blocked: 0.38,
  wrong: 0.34,
  place: 0.42,
  placeQuick: 0.36,
  event: 0.32,
  poof: 0.34,
  reveal: 0.42,
  revealHigh: 0.40,
  button: 0.34,
  successLow: 0.44,
  successHigh: 0.44,
};
const sfx = {
  tap: new Audio('assets/audio/sfx_tap.wav'),
  blocked: new Audio('assets/audio/sfx_blocked.wav'),
  wrong: new Audio('assets/audio/sfx_wrong.wav'),
  place: new Audio('assets/audio/sfx_place.wav'),
  placeQuick: new Audio('assets/audio/sfx_place_quick.wav'),
  event: new Audio('assets/audio/sfx_event.wav'),
  poof: new Audio('assets/audio/sfx_poof.wav'),
  reveal: new Audio('assets/audio/sfx_reveal.wav'),
  revealHigh: new Audio('assets/audio/sfx_reveal_high.wav'),
  button: new Audio('assets/audio/sfx_button.wav'),
  successLow: new Audio('assets/audio/sfx_success_low.wav'),
  successHigh: new Audio('assets/audio/sfx_success_high.wav'),
};
let audioUnlocked = false;
Object.keys(sfx).forEach(key=>{
  sfx[key].preload = 'auto';
  sfx[key].volume = SFX_VOLUME[key] || 0.4;
});
function unlockAudio(){
  audioUnlocked = true;
}
function tryPlayAudio(audio){
  const promise = audio.play();
  if(promise && typeof promise.catch === 'function') promise.catch(()=>{});
}
function playSfx(audio){
  if(!settings.sound || document.hidden || !audioUnlocked) return;
  audio.pause();
  audio.currentTime = 0;
  tryPlayAudio(audio);
}
function sfxForBeep(freq, dur, type){
  if(freq <= 220) return sfx.wrong;
  if(freq <= 340) return sfx.blocked;
  if(freq <= 470) return sfx.tap;
  if(freq <= 560) return sfx.poof;
  if(freq >= 600 && freq <= 640 && type === 'sine') return sfx.placeQuick;
  if(freq <= 640) return sfx.button;
  if(freq <= 690) return sfx.place;
  if(freq <= 780) return sfx.reveal;
  if(freq <= 850) return sfx.revealHigh;
  if(freq <= 980 && type === 'square') return sfx.event;
  if(freq <= 980) return sfx.successLow;
  return sfx.successHigh;
}
function beep(freq, dur, type){
  playSfx(sfxForBeep(freq, dur, type));
}
/* Haptics. `navigator.vibrate` does not exist in WKWebView at all, so on iOS —
   the platform this ships on — the vibration setting used to be a no-op with a
   switch in front of it. Route through @capacitor/haptics when the native
   bridge is there, keep navigator.vibrate for the browser build, and report
   whether anything is actually available so the settings row can hide itself
   rather than lie. */
function hapticsPlugin(){
  return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) || null;
}
function hapticsAvailable(){ return !!(hapticsPlugin() || navigator.vibrate); }
function vibrate(ms){
  if(!settings.vibrate) return;
  const h = hapticsPlugin();
  if(h){
    // The native API is a style, not a duration; map the three intensities the
    // game actually uses (light paint tick, medium confirm, heavy mistake).
    const style = ms >= 60 ? 'HEAVY' : (ms >= 15 ? 'MEDIUM' : 'LIGHT');
    try{ h.impact({style}); }catch(e){}
    return;
  }
  if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} }
}
/* External links. A plain target="_blank" is swallowed by WKWebView, so the
   App Store cards in the promo strip did nothing when tapped on device. */
function openExternal(url){
  const b = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
  if(b){ try{ b.open({url}); return true; }catch(e){} }
  try{ window.open(url, '_blank', 'noopener'); return true; }catch(e){}
  return false;
}

/* ---------------- Analytics (GameAnalytics) ----------------
   Both keys are meant to live in the client: the HTML5 SDK signs its payloads
   with the secret, so it ships in the bundle by design. They are not server
   credentials, but they do identify this game, so rotate them in the
   GameAnalytics dashboard if the build ever leaks somewhere it shouldn't.

   Everything goes through ga() rather than touching the SDK directly, so a
   blocked script, an ad blocker or a stripped build degrades to a no-op
   instead of throwing inside game logic.
----------------------------------------------------------- */
const GA_GAME_KEY   = '01afbf18bc0bba113deaadd793077d98';
const GA_SECRET_KEY = '167da862638f21c89b5ac6edeee5d38f3ac33d59';
const GA_BUILD      = '1.01';          // keep in step with MARKETING_VERSION
// GA rejects currencies that are not pure letters, and item types outside a
// small character set, so both lists are fixed up front and every call below
// draws from them.
const GA_CURRENCY   = 'CosmoCoin';
// Every itemType passed to addResourceEvent must appear here: the SDK checks
// membership in validateResourceEvent() and silently drops the whole event
// otherwise. 'Place' (shop) and 'Mission' were missing, so those two coin
// flows never reached the dashboard at all. 'Streak' is gone with the streak
// bonus it belonged to.
const GA_ITEM_TYPES = ['StageClear','Record','Avatar','Frame','Place','Mission'];

let gaReady = false;
function ga(){
  if(!gaReady) return;
  try{ window.GameAnalytics.apply(null, arguments); }
  catch(e){ console.warn('analytics call failed:', e); }
}
function initAnalytics(){
  if(typeof window.GameAnalytics !== 'function'){
    console.warn('GameAnalytics SDK not loaded; analytics disabled');
    return;
  }
  try{
    // Configuration has to happen before initialize() — the SDK ignores it
    // afterwards and then silently drops every event using those values.
    window.GameAnalytics('configureBuild', GA_BUILD);
    window.GameAnalytics('configureAvailableResourceCurrencies', [GA_CURRENCY]);
    window.GameAnalytics('configureAvailableResourceItemTypes', GA_ITEM_TYPES);
    window.GameAnalytics('setEnabledInfoLog', false);
    window.GameAnalytics('initialize', GA_GAME_KEY, GA_SECRET_KEY);
    gaReady = true;
  }catch(e){
    console.warn('analytics init failed:', e);
  }
}

/* ---- Event helpers -------------------------------------------------------
   Named so the call sites read as game vocabulary, and so the exact GA event
   shapes live in one place instead of being spelled out across the file.
------------------------------------------------------------------------- */
// "Stage" / "Lv7" / "7x7" — three levels of progression, so the dashboard can
// break a funnel down by ladder position and by board size.
// The ids are pinned to `state` when the stage starts rather than recomputed
// on the way out. onWin() increments progress.cleared before it reports, so a
// recomputed Complete would be labelled one level above its own Start and the
// two would never line up in a funnel.
function gaStageStart(){
  if(!state) return;
  state.gaIds = ['Stage', 'Lv' + (isHardMode ? 'Daily' : (progress.cleared + 1)),
                 state.n + 'x' + state.n];
  ga('addProgressionEvent', 'Start', state.gaIds[0], state.gaIds[1], state.gaIds[2]);
}
function gaStageEnd(status, score){
  const ids = (state && state.gaIds) || ['Stage', 'LvUnknown', ''];
  ga('addProgressionEvent', status, ids[0], ids[1], ids[2], score);
}
function gaStageComplete(score){ gaStageEnd('Complete', score); }
function gaStageFail(score){ gaStageEnd('Fail', score); }
function gaCoinsEarned(amount, itemType, itemId){
  if(!(amount > 0)) return;
  ga('addResourceEvent', 'Source', GA_CURRENCY, amount, itemType, itemId);
}
function gaCoinsSpent(amount, itemType, itemId){
  if(!(amount > 0)) return;
  ga('addResourceEvent', 'Sink', GA_CURRENCY, amount, itemType, itemId);
}
function gaDesign(eventId, value){
  if(typeof value === 'number') ga('addDesignEvent', eventId, value);
  else ga('addDesignEvent', eventId);
}
function gaError(message, severity){
  ga('addErrorEvent', severity || 'Warning', String(message).slice(0, 512));
}

/* ---------------- Game state ---------------- */
// Twelve hues spread evenly around the wheel with alternating lightness, so
// that even neighbouring hues separate on brightness alone. Measured in CIELAB
// the closest pair here is dE 28; the previous palette had a pair at dE 18,
// which is where the "these two look identical" indigo/violet clash came from.
const COLORS = ['#2E9FD4','#63C24A','#E8AB0E','#E04236','#9B4FCB','#128A5E',
                '#F27C1B','#2E48B5','#DA4B8C','#2FC9BC','#8A6238','#AFC70F'];
const SHAPE_GLYPHS = ['●','▲','■','◆','★','⬟','⬢','✚','⬣','◐','▼','⬤'];

// Perceptual (CIELAB) distance between two palette entries. Plain RGB distance
// badly misjudges how similar colours actually look.
const LAB = COLORS.map(hex=>{
  const v = [1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255)
    .map(x=> x>0.04045 ? Math.pow((x+0.055)/1.055, 2.4) : x/12.92);
  const X=(v[0]*0.4124+v[1]*0.3576+v[2]*0.1805)/0.95047;
  const Y= v[0]*0.2126+v[1]*0.7152+v[2]*0.0722;
  const Z=(v[0]*0.0193+v[1]*0.1192+v[2]*0.9505)/1.08883;
  const f=t=> t>0.008856 ? Math.cbrt(t) : (7.787*t+16/116);
  return [116*f(Y)-16, 500*(f(X)-f(Y)), 200*(f(Y)-f(Z))];
});
function labDist(a,b){
  return Math.hypot(LAB[a][0]-LAB[b][0], LAB[a][1]-LAB[b][1], LAB[a][2]-LAB[b][2]);
}

// Every region on the board gets its own colour — never a repeat, even between
// regions that don't touch. Two same-coloured blobs read as one region no
// matter how far apart they sit, which makes "one Cosmii per zone" unreadable.
// With at most 11 regions and 12 hues this is always possible, and we pick the
// subset that maximises the closest pair so small boards look wildly distinct.
function assignColors(n, regionOf, rng){
  const total = COLORS.length;
  let best=null, bestScore=-1;
  for(let seed=0; seed<total; seed++){
    const sel=[seed];
    while(sel.length < n){
      let pick=-1, pickScore=-1;
      for(let i=0;i<total;i++){
        if(sel.indexOf(i)>=0) continue;
        let nearest=Infinity;
        for(const s of sel) nearest = Math.min(nearest, labDist(i,s));
        if(nearest > pickScore){ pickScore=nearest; pick=i; }
      }
      sel.push(pick);
    }
    let score=Infinity;
    for(let i=0;i<sel.length;i++) for(let j=i+1;j<sel.length;j++)
      score = Math.min(score, labDist(sel[i], sel[j]));
    if(score > bestScore){ bestScore=score; best=sel; }
  }
  // Shuffle so the same board size doesn't always wear the same colours,
  // then hand the most contrasting pairs to regions that actually touch.
  const pool = best.slice();
  for(let i=pool.length-1;i>0;i--){ const j=(rng()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }

  const adj = Array.from({length:n},()=>new Set());
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const g = regionOf[r][c];
    if(r+1<n){ const h=regionOf[r+1][c]; if(h!==g){ adj[g].add(h); adj[h].add(g); } }
    if(c+1<n){ const h=regionOf[r][c+1]; if(h!==g){ adj[g].add(h); adj[h].add(g); } }
  }
  const order = Array.from({length:n},(_,i)=>i).sort((a,b)=>adj[b].size-adj[a].size);
  const out = new Array(n).fill(-1);
  const free = pool.slice();
  for(const g of order){
    let bestIdx=0, bestSep=-1;
    for(let i=0;i<free.length;i++){
      let sep=Infinity;
      for(const h of adj[g]) if(out[h]>=0) sep=Math.min(sep, labDist(free[i], out[h]));
      if(sep===Infinity) sep = 1000;               // no coloured neighbour yet
      if(sep > bestSep){ bestSep=sep; bestIdx=i; }
    }
    out[g] = free.splice(bestIdx,1)[0];
  }
  return out;
}

// one-time event, persisted so a retry (or an app restart) can't reuse it.

/* ---------------- Cosmo Coin economy ----------------
   A flat 10 per clear against 1000-coin avatars meant 700 clears to own
   everything, which made the whole unlock system decorative. The reward now
   scales with the board you actually solved and pays out for the things worth
   encouraging — coming back daily, and beating your own time.

   Rough pacing at these numbers: a 6x6 clear pays 32, an 11x11 pays 52, and a
   week-long streak adds 35 on top. First frame at ~5 clears, first avatar at
   ~12, the full set (2300) somewhere around 40-60.
------------------------------------------------------ */
const COIN_BASE          = 8;    // flat part of a clear
const COIN_PER_ROW       = 4;    // ...plus this much per board row
const COIN_HARD_MULT     = 2;    // Black Hole Cosmii (Hard Mode) is worth double
const COIN_RECORD_BONUS  = 15;   // beat your own best time for this size

// Returns the total and an itemised list, so the clear screen can show the
// player why they earned what they earned.
function clearReward({n, isHard, isRecord}){
  const parts = [];
  let base = COIN_BASE + COIN_PER_ROW * n;
  if(isHard) base *= COIN_HARD_MULT;
  parts.push({key:'reward_clear', amount:base});
  if(isRecord) parts.push({key:'reward_record', amount:COIN_RECORD_BONUS});
  return {total: parts.reduce((a,p)=>a+p.amount, 0), parts};
}

// The grid columns are laid out in fixed pixels while #grid-wrap is clipped by
// overflow:hidden, so the board MUST be sized to fit the viewport — anything
// wider is not merely cramped, it is silently cut off and those cells can never
// be tapped. There used to be a 44px floor on the cell size here, which meant
// every board of 8x8 or larger lost its right-hand columns on a phone-width
// screen. Small cells are the lesser evil, so the floor is only a last-resort
// guard against a degenerate viewport measurement.
const BOARD_PADDING = 10;               // #grid-wrap padding, both edges
const BOARD_GAP = 2;                    // grid gap between cells
const MIN_CELL = 18;
function computeBoardMetrics(n){
  const vw = window.visualViewport?.width  || window.innerWidth;
  const vh = window.visualViewport?.height || window.innerHeight;
  const chrome = (vh > 900) ? 140 : 220;               // top/bottom UI around the board
  const boardFactor = coach.active ? 0.72 : 0.75;
  const availWidth  = Math.max(200, vw - 32);          // #game-screen side padding
  const availHeight = Math.max(200, vh - chrome) * boardFactor;
  const size = Math.min(980, availWidth, availHeight);
  const gap = BOARD_GAP * (n - 1);
  const cellSize = Math.max(MIN_CELL, Math.floor((size - BOARD_PADDING - gap) / n));
  return {cellSize, boardSize: cellSize * n + gap + BOARD_PADDING};
}
// Sizing is split out from building so a rotation or a viewport change can
// re-fit the existing board without tearing down the cells and losing their
// rendered state.
function applyBoardSize(){
  if(!state) return;
  const n = state.n;
  const {cellSize, boardSize} = computeBoardMetrics(n);
  els.gridWrap.style.width = `${boardSize}px`;
  els.gridWrap.style.height = `${boardSize}px`;
  els.gridWrap.style.maxWidth = '100%';
  els.gridWrap.style.gridTemplateColumns = `repeat(${n}, ${cellSize}px)`;
  els.gridWrap.style.gridTemplateRows = `repeat(${n}, ${cellSize}px)`;
}

/* computeBoardMetrics() budgets for the surrounding UI with a constant, but the
   real height of the top bar, pills, rule cards and action bar shifts with
   language, font metrics and safe-area insets. Measure the actual gap once the
   screen is laid out and shrink the board if the estimate was too generous —
   on a short phone the bottom row otherwise ended up under the action bar or
   clipped away by #grid-wrap's overflow:hidden. */
function fitBoardHeight(){
  if(!state || coach.active) return;
  const bar = document.querySelector('#game-screen .bottombar');
  if(!bar) return;
  requestAnimationFrame(()=>{
    if(!state || coach.active) return;
    const g = els.gridWrap.getBoundingClientRect();
    const vh = window.visualViewport?.height || window.innerHeight;
    // Derive the limit from the viewport rather than the bar's current top:
    // when the column already overflows, the bar itself is pushed off-screen
    // and its position would report far more room than exists.
    const room = (vh - bar.getBoundingClientRect().height - 36) - g.top;
    if(room < 80 || g.height <= room + 1) return;
    const n = state.n;
    const gap = BOARD_GAP * (n - 1);
    const cell = Math.max(MIN_CELL, Math.floor((room - BOARD_PADDING - gap) / n));
    const size = cell * n + gap + BOARD_PADDING;
    els.gridWrap.style.width = `${size}px`;
    els.gridWrap.style.height = `${size}px`;
    els.gridWrap.style.gridTemplateColumns = `repeat(${n}, ${cell}px)`;
    els.gridWrap.style.gridTemplateRows = `repeat(${n}, ${cell}px)`;
  });
}

function buildGrid(){
  const n = state.n;
  els.gridWrap.innerHTML='';
  els.gridWrap.classList.toggle('pattern-on', settings.pattern);
  applyBoardSize();

  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      const cell = document.createElement('div');
      cell.className='cell';
      cell.dataset.r=r; cell.dataset.c=c;
      const reg = state.regionOf[r][c];
      cell.style.background = COLORS[state.colorOf[reg]];

      const patt = document.createElement('span');
      patt.className='pattern-mark';
      patt.textContent = SHAPE_GLYPHS[state.colorOf[reg]];
      cell.appendChild(patt);

      const piece = document.createElementNS('http://www.w3.org/2000/svg','svg');
      piece.setAttribute('viewBox','0 0 100 100');
      piece.setAttribute('class','piece');
      piece.innerHTML = `
        <ellipse cx="50" cy="56" rx="38" ry="34" fill="#EAF6FA"/>
        <path d="M50 10 L54 21 L65 17 L58 27 Z" fill="#E8963C"/>
        <circle cx="36" cy="53" r="10" fill="#2b2320"/>
        <circle cx="64" cy="53" r="10" fill="#2b2320"/>
        <circle cx="39" cy="50" r="3.2" fill="#fff"/>
        <circle cx="67" cy="50" r="3.2" fill="#fff"/>
        <path d="M42 69 Q50 75 58 69" stroke="#2b2320" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
      cell.appendChild(piece);

      const characterImg = document.createElement('img');
      characterImg.className = 'character-img';
      characterImg.alt = 'Cosmii';
      characterImg.style.display = 'none';
      cell.appendChild(characterImg);

      const cross = document.createElementNS('http://www.w3.org/2000/svg','svg');
      cross.setAttribute('viewBox','0 0 100 100');
      cross.setAttribute('class','cross-svg');
      cross.innerHTML =
        `<path class="halo" d="M25 25 L75 75 M75 25 L25 75" stroke-linecap="round"/>` +
        `<path class="mark" d="M25 25 L75 75 M75 25 L25 75" stroke-linecap="round"/>`;
      cell.appendChild(cross);

      els.gridWrap.appendChild(cell);
    }
  }
}

function cellEl(r,c){ return els.gridWrap.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); }

/* ---- input ---------------------------------------------------------------
   single tap        = toggle one X
   double tap        = place a Cosmii
   press and drag    = sweep X across every cell the finger passes through
Marking a whole row or column one careful tap at a time is the most repetitive
part of solving, so a drag paints continuously. The stroke's direction is set
by the cell it starts on: begin on an empty cell and the whole stroke adds Xs,
begin on an existing X and the whole stroke erases. Locking the mode up front
means a sweep never flickers marks on and off as it crosses mixed cells.
--------------------------------------------------------------------------- */
const pendingClicks = new Map();
const DOUBLE_TAP_WINDOW = 320;
const DRAG_THRESHOLD = 10;          // px before a press counts as a drag

let drag = null;
let lastPaintSound = 0;

function cellAtPoint(x, y){
  let el = null;
  try{ el = document.elementFromPoint(x, y); }catch(err){ return null; }
  if(!el) return null;
  const cell = el.closest ? el.closest('.cell') : null;
  return (cell && els.gridWrap.contains(cell)) ? cell : null;
}

function paintCell(r, c){
  const key = r+'_'+c;
  if(drag.painted.has(key)) return;
  drag.painted.add(key);
  // A queued tap must not undo a mark made by this stroke.
  if(pendingClicks.has(key)){ clearTimeout(pendingClicks.get(key)); pendingClicks.delete(key); }
  if(state.board[r][c]===1 || state.board[r][c]===3) return;   // sealed cells
  if(coach.active){
    // During the tutorial only the highlighted cells respond, so a stray
    // sweep can't scribble over the rest of the board.
    if(!coach.remaining || !coach.remaining.has(key)) return;
    if(coach.act!=='cross') return;
  }
  const want = (drag.mode==='draw') ? 2 : 0;
  if(state.board[r][c]===want) return;
  state.board[r][c] = want;
  renderCell(r,c);
  const now = Date.now();
  if(now - lastPaintSound > 45){                    // throttle: a fast sweep
    lastPaintSound = now;                           // shouldn't machine-gun
    beep(drag.mode==='draw' ? 420 : 330, 0.04, 'triangle');
    vibrate(8);
  }
  if(coach.active && want===2) coachCellDone(r,c);
}

function onGridPointerDown(e){
  if(!state || state.finished || state.suntvBusy || drag) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  const cell = e.target.closest ? e.target.closest('.cell') : null;
  if(!cell || !els.gridWrap.contains(cell)) return;
  drag = {
    r:+cell.dataset.r, c:+cell.dataset.c,
    x:e.clientX, y:e.clientY, pointerId:e.pointerId,
    lastX:e.clientX, lastY:e.clientY,
    mode:null, moved:false, painted:new Set(),
  };
  try{ els.gridWrap.setPointerCapture(e.pointerId); }catch(err){}
}

function paintGridSegment(x, y){
  const stroke = drag;
  const dx = x - stroke.lastX, dy = y - stroke.lastY;
  // Hit-test along the screen-space path, including rotated boards and gaps.
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 4));
  for(let i = 1; i <= steps; i++){
    if(drag !== stroke) return;
    const cell = cellAtPoint(stroke.lastX + dx * i / steps, stroke.lastY + dy * i / steps);
    if(cell) paintCell(+cell.dataset.r, +cell.dataset.c);
  }
  stroke.lastX = x;
  stroke.lastY = y;
}

function onGridPointerMove(e){
  if(!drag || e.pointerId !== drag.pointerId) return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < DRAG_THRESHOLD) return;
    // Starting a sweep on a Cosmii or a sealed red X would be ambiguous.
    const v0 = state.board[drag.r][drag.c];
    if(v0===1 || v0===3){ drag=null; return; }
    drag.moved = true;
    drag.mode = (state.board[drag.r][drag.c]===2) ? 'erase' : 'draw';
    // A tap already queued for this cell would fire mid-sweep and undo it.
    const key = drag.r+'_'+drag.c;
    if(pendingClicks.has(key)){ clearTimeout(pendingClicks.get(key)); pendingClicks.delete(key); }
    paintCell(drag.r, drag.c);
  }
  // Coalesced samples preserve bends when the browser batches finger movement.
  const samples = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for(const sample of samples){
    if(!drag) return;
    paintGridSegment(sample.clientX, sample.clientY);
  }
  if(drag) paintGridSegment(e.clientX, e.clientY);
}

function finishGridPointer(e, cancelled){
  if(!drag || e.pointerId !== drag.pointerId) return;
  if(!cancelled) onGridPointerMove(e);
  if(!drag) return;
  const d = drag; drag = null;
  if(e && e.pointerId !== undefined){
    try{ els.gridWrap.releasePointerCapture(e.pointerId); }catch(err){}
  }
  if(d.moved) return;                               // it was a sweep, not a tap
  handleCellTap(d.r, d.c);
}
function onGridPointerUp(e){ finishGridPointer(e, false); }
// pointercancel fires when the system takes the gesture over. Dropping it
// silently loses legitimate taps, which is the difference between a tutorial
// that advances and one that appears frozen.
function onGridPointerCancel(e){ finishGridPointer(e, true); }

function handleCellTap(r, c){
  if(state.finished) return;
  if(coach.active && !coachAllowsCell(r,c)) return;
  // The tutorial uses single tap for crosses, so bypass the double-tap timer.
  if(coach.active && coach.act==='cross'){
    handleSingleTap(r,c);
    return;
  }
  // Place mode turns a single tap into a placement, which is far less fiddly
  // than double-tapping every cell. It also fires immediately instead of
  // waiting out the double-tap window, so the board feels sharper.
  // The tutorial always teaches the double tap, so it opts out.
  if(settings.placeMode && !coach.active){
    // Tapping a cell you already crossed off clears the mark instead of
    // placing. Otherwise undoing a stray X in this mode would cost a life.
    if(state.board[r][c]===2){ handleSingleTap(r,c); return; }
    handleDoubleTap(r,c);
    return;
  }
  const key = r+'_'+c;
  if(pendingClicks.has(key)){
    clearTimeout(pendingClicks.get(key));
    pendingClicks.delete(key);
    handleDoubleTap(r,c);
  } else {
    const timer = setTimeout(()=>{ pendingClicks.delete(key); handleSingleTap(r,c); }, DOUBLE_TAP_WINDOW);
    pendingClicks.set(key, timer);
  }
}
function handleSingleTap(r,c){
  if(state.suntvBusy) return;
  if(coach.active && coach.act && coach.act!=='cross'){ coachNudge(); return; }
  const cur = state.board[r][c];
  // Settled cells are read-only: a red X is a spent life, and a placed Cosmii
  // is part of the one true solution. This used to guard only the X, so a
  // single tap on a Cosmii fell through to the "clear the mark" branch and
  // removed it — and re-placing it paid the score bonus out all over again,
  // which let one cell be tapped for points indefinitely. handleDoubleTap has
  // always rejected both; the two paths now agree.
  if(cur===1 || cur===3){ beep(300,0.07,'sine'); pulseLocked(r,c); return; }
  state.board[r][c] = (cur===0) ? 2 : 0;
  renderCell(r,c);
  beep(420,0.05,'triangle');
  if(coach.active && coach.act==='cross' && state.board[r][c]===2) coachCellDone(r,c);
}
function handleDoubleTap(r,c,fromAutoPlace){
  if(state.suntvBusy) return;
  if(coach.active && coach.act && coach.act!=='place'){ coachNudge(); return; }
  const cur = state.board[r][c];
  // A placed Cosmii is always part of the one true solution (isValidPlacement
  // rejects anything else), so there is never a reason to take one back — and
  // a stray double tap undoing hard-won progress just feels like a bug.
  if(cur===1 || cur===3){ beep(300,0.07,'sine'); pulseLocked(r,c); return; }
  if(isValidPlacement(r,c)){
    state.board[r][c]=1;
    assignRandomCharacter(r,c);
    renderCell(r,c);
    onCorrectPlacement(r,c);
    if(settings.placeMode){
      state.placeUses = Math.max(0, state.placeUses - 1);
      updatePlaceUsesUI();
      if(state.placeUses === 0){
        settings.placeMode = false;
        renderPlaceMode();
      }
    }
    if(coach.active && coach.act==='place'){ coachCellDone(r,c); return; }
    // The event is specifically a reaction to the player's own double-tap
    // gesture, not to the auto-placement button doing the same job.
    if(!fromAutoPlace && suntvShouldTrigger()){ suntvTriggerEvent(); return; }
    checkWin();
  } else {
    // Seal the cell with a red X rather than clearing it. The guess is now
    // proven wrong, so leaving it blank would invite the same mistake twice
    // and throw away information the player paid a life for.
    state.board[r][c]=3;
    renderCell(r,c);
    cellEl(r,c).classList.add('shake');
    beep(180,0.25,'square'); vibrate(80);
    setTimeout(()=>{ cellEl(r,c).classList.remove('shake'); },350);
    state.hearts--;
    updateHearts();
    if(state.hearts<=0){
      state.finished=true; stopTimer();
      renderHintState();          // the board is over; grey the hint button too
      // A failed attempt un-uses the サンテレビ event for this stage — the
      // "no repeats" rule is about farming a clear, not about being denied
      // it forever after a genuine fail-and-retry.
      if(state.suntvFired){
        const stageNum = progress.cleared + 1;
        delete suntvSeenStages[stageNum];
        saveJSON('suntv-seen-stages', suntvSeenStages);
        state.suntvFired = false;
      }
      gaStageFail(progress.score);
      showOverModal();
    }
  }
}
function isValidPlacement(r,c){
  // Each puzzle has exactly one valid full solution. Checking only against
  // currently-placed pieces would let a player commit a move that looks fine
  // locally but strands a region with no legal cell many moves later.
  return state.solution[r] === c;
}
// A tiny bounce, so tapping a settled Cosmii reads as "this one is done"
// rather than as the tap having been swallowed.
function pulseLocked(r,c){
  const el = cellEl(r,c);
  if(!el) return;
  el.classList.remove('locked-pulse');
  void el.offsetWidth;
  el.classList.add('locked-pulse');
  setTimeout(()=>el.classList.remove('locked-pulse'), 400);
}
function renderCell(r,c){
  const el = cellEl(r,c); const v = state.board[r][c];
  el.classList.toggle('filled', v===1);
  el.classList.toggle('crossed', v===2);
  el.classList.toggle('wrong', v===3);
  const charName = (v===1 && state.character && state.character[r]) ? state.character[r][c] : '';
  el.classList.toggle('character-filled', !!charName);
  const img = el.querySelector('.character-img');
  if(img){
    if(charName){
      // If the PNG is missing, drop back to the built-in SVG Cosmii rather
      // than leaving an empty square where a piece should be.
      img.onerror = ()=>{ img.style.display='none'; el.classList.remove('character-filled'); };
      setCharacterImage(img, charName);
      img.style.display = 'block';
    } else {
      img.onerror = null;
      img.removeAttribute('src');
      img.style.display = 'none';
    }
  }
  if(v!==1) el.classList.remove('hinted');
}
function updateHearts(){ els.hearts.innerHTML = heartsHtml(state.hearts, state.maxHearts); }

function placedCount(){
  let p=0;
  for(let i=0;i<state.n;i++) for(let j=0;j<state.n;j++) if(state.board[i][j]===1) p++;
  return p;
}

// Celebration overlays are parented to the game screen, not to the board.
// #grid-wrap clips its own overflow so its fixed-pixel rows can never spill,
// and that quietly swallowed both effects: the "Great!" banner sits above the
// board's top edge, and the +score popup rises out of the cell it started in,
// so on the top row it left the box entirely. The screen is inset:0 over the
// whole viewport and the page never scrolls, so client coordinates map onto it
// directly.
function screenPoint(el){
  const a = el.getBoundingClientRect();
  const b = els.game.getBoundingClientRect();
  return {x: a.left - b.left + a.width / 2, y: a.top - b.top, h: a.height};
}
function showFloatingPoints(cellElement, text){
  const fp = document.createElement('div');
  fp.className = 'floatpts';
  fp.textContent = text;
  const p = screenPoint(cellElement);
  fp.style.left = p.x + 'px';
  fp.style.top  = (p.y + p.h * 0.2) + 'px';
  els.game.appendChild(fp);
  setTimeout(()=>fp.remove(), 850);
}
function showGreatBanner(text){
  const banner = document.createElement('div');
  banner.className = 'banner-great';
  banner.textContent = text;
  const p = screenPoint(els.gridWrap);
  banner.style.left = p.x + 'px';
  banner.style.top  = (p.y - 6) + 'px';
  els.game.appendChild(banner);
  setTimeout(()=>banner.remove(), 1000);
}

async function onCorrectPlacement(r,c){
  beep(660,0.15,'sine'); vibrate(15);
  const pts = 60 + Math.floor(Math.random()*120);
  progress.score += pts;
  updateHeaderStats();

  // Feedback first, persistence after. Awaiting the save before touching the
  // DOM meant the score popup and the progress counter waited on a storage
  // round-trip — which is a real bridge call once @capacitor/preferences is
  // the backend, not the instant localStorage write it used to be.
  const el = cellEl(r,c);
  if(el) showFloatingPoints(el, '+' + pts);

  const placed = placedCount();
  els.progressCur.textContent = placed;
  if(!coach.active && placed>1 && Math.random()<0.35 && placed<state.n){
    showGreatBanner(Math.random()<0.5 ? 'Great' : 'Nice!');
  }

  await saveJSON('progress', progress);
}

/* ================= サンテレビ おじゃまイベント =================
   Every 5th stage (5, 10, 15, 20…) gets one surprise event, triggered right
   after the player's first correct placement on that stage. Only ever runs
   on normal stages — Black Hole Cosmii and Time Attack are explicitly out of
   scope — and never during the tutorial. One of four effects fires, chosen
   by weighted chance; two of them (clear X's, reveal 2) fall back out of the
   draw when their precondition can't be met (no X's yet / nothing left to
   reveal) so the remaining pool is redrawn instead of doing nothing. */
const SUN_TV_COLLAB_ENABLED = true;
const SUN_TV_COLLAB = {
  enabled: SUN_TV_COLLAB_ENABLED,
  assets: {
    titleBanner: 'assets/images/ohsun_07.png',
    rotateBoard: 'assets/images/ohsun_12.png',
    clearCrossMarks: 'assets/images/ohsun_11.png',
    revealTwoCosmii: 'assets/images/ohsun_10.png',
    completeGame: [
      'assets/images/ohsun_07.png', 'assets/images/ohsun_08.png',
      'assets/images/ohsun_09.png', 'assets/images/ohsun_10.png',
      'assets/images/ohsun_11.png', 'assets/images/ohsun_12.png',
      'assets/images/ohsun_13.png',
    ],
  },
};
const SUNTV_EVENT_INTERVAL = 2;     // every multiple of 2 gets the event, no exceptions
const SUNTV_EVENTS = [
  {type:'rotate',   weight:45},
  {type:'clearx',   weight:15},
  {type:'reveal2',  weight:30},
  {type:'clearall', weight:10},
];
function suntvHasXMarks(){
  for(let r=0;r<state.n;r++) for(let c=0;c<state.n;c++) if(state.board[r][c]===2) return true;
  return false;
}
function suntvHasUnplacedCorrect(){
  for(let r=0;r<state.n;r++) if(state.board[r][state.solution[r]]===0) return true;
  return false;
}
function suntvShouldTrigger(){
  if(!SUN_TV_COLLAB.enabled || !settings.suntvEvents) return false;
  if(!state || state.hardMode || state.timeAttack) return false;
  if(coach.active || state.suntvFired || state.suntvBusy) return false;
  const stageNum = progress.cleared + 1;
  if(stageNum % SUNTV_EVENT_INTERVAL !== 0) return false;
  if(suntvSeenStages[stageNum]) return false;
  // Timing is randomised per stage (state.suntvTriggerAt, chosen when the
  // puzzle was generated) rather than always firing on the first placement.
  if(state.suntvTriggerAt == null || placedCount() < state.suntvTriggerAt) return false;
  return true;
}
function suntvPickEventType(){
  let pool = SUNTV_EVENTS.filter(e=>{
    if(e.type==='clearx') return suntvHasXMarks();
    if(e.type==='reveal2') return suntvHasUnplacedCorrect();
    return true;
  });
  if(!pool.length) pool = [{type:'clearall', weight:1}];   // always valid, so this is the safe floor
  const total = pool.reduce((a,e)=>a+e.weight, 0);
  let roll = Math.random() * total;
  for(const e of pool){ if(roll < e.weight) return e.type; roll -= e.weight; }
  return pool[pool.length-1].type;
}
/* An event is a long chain of awaits — two of them wait on a player tap, which
   may simply never come because the player left. Each run therefore claims a
   token and the board it belongs to, and re-checks both after every await, so
   a chain that outlived its board unwinds instead of applying its effect to
   whatever is on screen by then. */
let suntvRunId = 0;
let suntvCancelWait = null;
// Invalidates any in-flight event and puts the screen back the way it was.
function suntvCancelEvent(){
  suntvRunId++;
  if(suntvCancelWait){ const cancel = suntvCancelWait; suntvCancelWait = null; cancel(); }
  const overlay = document.getElementById('suntv-overlay');
  if(overlay){
    overlay.classList.remove('char-rise','char-set','msg-in','awaiting-tap');
    overlay.style.pointerEvents = 'none';
  }
  const dim = document.getElementById('suntv-fullscreen-dim');
  if(dim) dim.classList.remove('on');
  suntvClearCharacter();
}
function suntvClearCharacter(){
  const character = document.getElementById('suntv-character');
  character.className = 'suntv-character';
  character.replaceChildren();
}
function suntvSetCharacter(type){
  const character = document.getElementById('suntv-character');
  suntvClearCharacter();
  if(!SUN_TV_COLLAB.enabled) return;
  const paths = type === 'rotate' ? [SUN_TV_COLLAB.assets.rotateBoard]
    : type === 'clearx' ? [SUN_TV_COLLAB.assets.clearCrossMarks]
    : type === 'reveal2' ? [SUN_TV_COLLAB.assets.revealTwoCosmii]
    : SUN_TV_COLLAB.assets.completeGame;
  // Each event shows one character, including the complete-game variants.
  const path = paths.length === 1 ? paths[0] : paths[Math.floor(Math.random() * paths.length)];
  const image = document.createElement('img');
  image.alt = 'おっ！サンコラボ';
  image.decoding = 'async';
  image.addEventListener('error', ()=>image.remove(), {once:true});
  image.src = path;
  character.appendChild(image);
}
function suntvShowCharacter(){
  const overlay = document.getElementById('suntv-overlay');
  stopTimer();   // the clock shouldn't run while the character is on screen
  overlay.style.pointerEvents = 'auto';   // captures taps for the rest of the event
  document.getElementById('suntv-fullscreen-dim').classList.add('on');   // whole screen but the character dims
  beep(920, 0.14, 'square');   // placeholder cue — swap for a real SFX asset when one exists
  vibrate(20);
  void overlay.offsetWidth;   // flush the character's off-screen starting position first
  overlay.classList.add('char-rise');   // sunrise: bottom-left up to resting spot on the left
  return new Promise(resolve=>setTimeout(resolve, 1320));
}
// Pauses the sequence until the player taps the overlay — the event now
// advances step by step on tap rather than purely on a timer.
function suntvWaitForTap(){
  const overlay = document.getElementById('suntv-overlay');
  const screen = document.getElementById('game-screen');
  overlay.classList.add('awaiting-tap');
  return new Promise(resolve=>{
    const finish = ()=>{
      screen.removeEventListener('pointerdown', handler);
      if(suntvCancelWait === finish) suntvCancelWait = null;
      overlay.classList.remove('awaiting-tap');
      resolve();
    };
    const handler = ()=>finish();
    // Listens on the whole screen, not just the character/board area — the
    // dim now covers everything, so "tap anywhere" should too, not just a
    // tap that happens to land on the icon itself.
    // Not {once:true}: the listener has to be removable from the outside too,
    // or leaving mid-event strands it on the screen, where the next board's
    // first tap would resume an event that no longer belongs to anything.
    screen.addEventListener('pointerdown', handler);
    suntvCancelWait = finish;
  });
}
function suntvHideCharacter(){
  const overlay = document.getElementById('suntv-overlay');
  overlay.classList.remove('msg-in');
  overlay.classList.add('char-set');   // sunset: sinks away toward the bottom-right, slowly
  // The dim stays on through the whole sunset — the screen only brightens
  // back up once the character has fully disappeared.
  return new Promise(resolve=>setTimeout(()=>{
    document.getElementById('suntv-fullscreen-dim').classList.remove('on');
    overlay.classList.remove('char-rise','char-set');
    overlay.style.pointerEvents = 'none';
    suntvClearCharacter();
    startTimer();   // the character is gone — the clock can run again
    resolve();
  }, 1150));
}
function suntvRotateBoard(){
  return new Promise(resolve=>{
    const grid = els.gridWrap;
    grid.style.transition = 'transform .6s ease';
    grid.style.transformOrigin = 'center center';
    state.suntvRotation = ((state.suntvRotation||0) + 90) % 360;
    grid.style.transform = `rotate(${state.suntvRotation}deg)`;
    grid.classList.add('suntv-rot90');   // keeps every Cosmii face upright as the board turns
    setTimeout(resolve, 620);
  });
}
function suntvClearXMarks(){
  const n = state.n;
  const cells = [];
  // Only the player's own voluntary marks (2) — a locked, heart-spent wrong
  // guess (3) stays locked, or clearing it would look like an invite to
  // retry a cell that already cost a life.
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(state.board[r][c]===2) cells.push([r,c]);
  return new Promise(resolve=>{
    let i=0;
    function step(){
      if(i>=cells.length){ resolve(); return; }
      const [r,c] = cells[i++];
      state.board[r][c] = 0;
      renderCell(r,c);
      const el = cellEl(r,c);
      if(el){ el.classList.add('suntv-poof'); setTimeout(()=>el.classList.remove('suntv-poof'), 300); }
      beep(520, 0.03, 'sine');
      setTimeout(step, 55);
    }
    step();
  });
}
function suntvReveal2(){
  const n = state.n;
  const candidates = [];
  for(let r=0;r<n;r++){
    const c = state.solution[r];
    if(state.board[r][c] === 0) candidates.push([r,c]);
  }
  for(let i=candidates.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
  const picks = candidates.slice(0, 2);
  return new Promise(resolve=>{
    let i=0;
    function step(){
      if(i>=picks.length){ resolve(); return; }
      const [r,c] = picks[i++];
      state.board[r][c] = 1;
      assignRandomCharacter(r,c);
      renderCell(r,c);
      const el = cellEl(r,c);
      if(el){ el.classList.add('suntv-pop'); setTimeout(()=>el.classList.remove('suntv-pop'), 300); }
      onCorrectPlacement(r,c);
      beep(720, 0.09, 'triangle');
      setTimeout(step, 380);
    }
    step();
  });
}
function suntvClearAllReveal(){
  const n = state.n;
  const cells = [];
  for(let r=0;r<n;r++){
    const c = state.solution[r];
    if(state.board[r][c] !== 1) cells.push([r,c]);
  }
  return new Promise(resolve=>{
    let i=0;
    function step(){
      if(i>=cells.length){ resolve(); return; }
      const [r,c] = cells[i++];
      state.board[r][c] = 1;
      assignRandomCharacter(r,c);
      renderCell(r,c);
      const el = cellEl(r,c);
      if(el){ el.classList.add('suntv-pop'); setTimeout(()=>el.classList.remove('suntv-pop'), 250); }
      beep(820, 0.06, 'triangle');
      setTimeout(step, 85);
    }
    step();
  });
}
async function suntvTriggerEvent(){
  state.suntvFired = true;
  state.suntvBusy = true;
  const stageNum = progress.cleared + 1;
  suntvSeenStages[stageNum] = true;
  saveJSON('suntv-seen-stages', suntvSeenStages);
  gaDesign('SuntvEvent:Trigger', stageNum);
  const type = suntvPickEventType();
  suntvSetCharacter(type);

  // Claim this run. If either changes underneath us the board we were acting
  // on is gone, and the rest of the chain must not touch whatever replaced it.
  const myRun = ++suntvRunId;
  const myState = state;
  const lost = ()=> suntvRunId !== myRun || state !== myState;
  const bail = ()=>{ myState.suntvBusy = false; return true; };

  await suntvShowCharacter();   // rises from the bottom, dims the screen, stops mid-way — automatic
  if(lost()) return bail();
  await suntvWaitForTap();      // → tap to continue
  if(lost()) return bail();

  gaDesign('SuntvEvent:' + type);
  if(type==='rotate'){ await suntvRotateBoard(); }
  else if(type==='clearx'){ await suntvClearXMarks(); }
  else if(type==='reveal2'){ await suntvReveal2(); }
  else if(type==='clearall'){ await suntvClearAllReveal(); }
  if(lost()) return bail();

  await suntvWaitForTap();      // → tap to continue
  if(lost()) return bail();
  await suntvHideCharacter();   // sunset, slowly, screen brightens back up once it's gone
  if(lost()) return bail();

  state.suntvBusy = false;
  checkWin();   // reveal2 / clearall may have just completed the board
}

/* ================= Shop ================= */
/* Sells two things: extra hints and extra Cosmii-placements, each spendable
   once a puzzle's free allowance runs out. progress.hintBank / placeBank
   persist across puzzles and sessions, unlike state.hintsLeft / placeUses
   which reset with every new board. */
const HINT_PRICE = 30;
const PLACE_PRICE = 30;
// Shared cap on progress.placeBank — whether it's topped up by buying in the
// shop or by sharing, the stockpile itself can't exceed this.
const PLACE_BANK_MAX = 5;
const SHOP_ITEMS = {
  place: {price: PLACE_PRICE, bankKey: 'placeBank', ownedEl: 'shop-place-owned', toastKey: 'toast_place_bought', max: PLACE_BANK_MAX},
};
function renderShop(){
  const coinEl = document.getElementById('shop-coin-balance');
  if(coinEl) coinEl.textContent = progress.coins;
  for(const kind in SHOP_ITEMS){
    const cfg = SHOP_ITEMS[kind];
    const ownedEl = document.getElementById(cfg.ownedEl);
    if(ownedEl) ownedEl.textContent = progress[cfg.bankKey] || 0;
  }
  document.querySelectorAll('.shop-buy-btn').forEach(btn=>{
    const kind = btn.dataset.kind;
    const cfg = SHOP_ITEMS[kind];
    if(!cfg) return;
    const qty = parseInt(btn.dataset.qty, 10);
    const price = cfg.price * qty;
    const priceEl = btn.querySelector('.shop-buy-price');
    if(priceEl) priceEl.textContent = '🪙' + price;
    const owned = progress[cfg.bankKey] || 0;
    const wouldExceedMax = cfg.max != null && owned >= cfg.max;
    btn.disabled = progress.coins < price || wouldExceedMax;
  });
}
async function buyShopItem(kind, qty){
  const cfg = SHOP_ITEMS[kind];
  if(!cfg) return;
  const owned = progress[cfg.bankKey] || 0;
  if(cfg.max != null && owned >= cfg.max){ showToast(t('toast_share_max')); return; }
  // Buying past the cap (e.g. ×5 while sitting at 3/5) only grants the
  // remaining room — charge for exactly that many, not the full bundle.
  if(cfg.max != null) qty = Math.min(qty, cfg.max - owned);
  const price = cfg.price * qty;
  if(progress.coins < price){ showToast(t('toast_need_coins')); return; }
  progress.coins -= price;
  progress[cfg.bankKey] = owned + qty;
  updateHeaderStats();
  renderCoins(true);
  await saveJSON('progress', progress);
  gaCoinsSpent(price, kind==='hint' ? 'Hint' : 'Place', 'Shop');
  showToast(t(cfg.toastKey, qty));
  renderShop();
  renderHintState();
  renderPlaceMode();
}

/* ================= Missions ================= */
/* Daily missions reset with the calendar day; weekly missions reset every
   Sunday (local time). Both persist through the same storage backend as the
   rest of the app's progress, so a claim survives a relaunch. */
function sundayOf(d){
  const dt = new Date(d);
  dt.setDate(dt.getDate() - dt.getDay()); // getDay(): 0 = Sunday
  dt.setHours(0,0,0,0);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
const DAILY_MISSION_COIN = 100;
const WEEKLY_MISSION_COIN = 1000;
const WEEKLY_LOGIN_TARGET = 5;
const WEEKLY_NORMAL_TARGET = 100;
const WEEKLY_HARD_TARGET = 50;
const DAILY_STAGE_TARGET = 10;

function freshMissionState(){
  return {
    date:null, loginDone:false, stageCount:0, hintUsed:false,
    claimedLogin:false, claimedStage:false, claimedHint:false,
    weekStart:null, loginDays:[], normalCleared:0, hardCleared:0,
    claimedWeekLogin:false, claimedWeekNormal:false, claimedWeekHard:false,
  };
}
let missionState = freshMissionState();

// Rolls daily/weekly fields forward if the calendar has moved on since the
// state was last touched. Called on load and whenever the mission modal or
// title screen might show stale counters.
function rollMissionState(){
  const today = todayStr();
  if(missionState.date !== today){
    missionState.date = today;
    missionState.loginDone = true;      // opening the app today counts as today's login
    missionState.stageCount = 0;
    missionState.hintUsed = false;
    missionState.claimedLogin = false;
    missionState.claimedStage = false;
    missionState.claimedHint = false;
    if(missionState.loginDays.indexOf(today) < 0) missionState.loginDays.push(today);
  }
  const wk = sundayOf(new Date());
  if(missionState.weekStart !== wk){
    missionState.weekStart = wk;
    missionState.loginDays = [today];
    missionState.normalCleared = 0;
    missionState.hardCleared = 0;
    missionState.claimedWeekLogin = false;
    missionState.claimedWeekNormal = false;
    missionState.claimedWeekHard = false;
  }
}
async function saveMissionState(){ await saveJSON('missions', missionState); }

// Hooked from onWin(): every non-Time-Attack stage clear counts toward the
// relevant weekly total and the daily "10 stages" mission.
async function onStageClearedForMissions(isHard){
  rollMissionState();
  missionState.stageCount += 1;
  if(isHard) missionState.hardCleared += 1; else missionState.normalCleared += 1;
  await saveMissionState();
  renderMissions();
}
async function onDailyPlaceUsedForMissions(){
  rollMissionState();
  if(!missionState.hintUsed){ missionState.hintUsed = true; await saveMissionState(); renderMissions(); }
}
async function claimMission(kind){
  rollMissionState();
  let amount = 0;
  if(kind==='login' && missionState.loginDone && !missionState.claimedLogin){ missionState.claimedLogin = true; amount = DAILY_MISSION_COIN; }
  else if(kind==='stage' && missionState.stageCount>=DAILY_STAGE_TARGET && !missionState.claimedStage){ missionState.claimedStage = true; amount = DAILY_MISSION_COIN; }
  else if(kind==='hint' && missionState.hintUsed && !missionState.claimedHint){ missionState.claimedHint = true; amount = DAILY_MISSION_COIN; }
  else if(kind==='weekLogin' && missionState.loginDays.length>=WEEKLY_LOGIN_TARGET && !missionState.claimedWeekLogin){ missionState.claimedWeekLogin = true; amount = WEEKLY_MISSION_COIN; }
  else if(kind==='weekNormal' && missionState.normalCleared>=WEEKLY_NORMAL_TARGET && !missionState.claimedWeekNormal){ missionState.claimedWeekNormal = true; amount = WEEKLY_MISSION_COIN; }
  else if(kind==='weekHard' && missionState.hardCleared>=WEEKLY_HARD_TARGET && !missionState.claimedWeekHard){ missionState.claimedWeekHard = true; amount = WEEKLY_MISSION_COIN; }
  if(amount<=0) return;
  progress.coins += amount;
  updateHeaderStats(); renderCoins(true);
  await saveJSON('progress', progress);
  await saveMissionState();
  gaCoinsEarned(amount, 'Mission', kind);
  showToast(t('toast_mission_claimed', amount));
  renderMissions();
}
function missionRow({title, current, target, claimed, kind, coin}){
  const done = current >= target;
  const pct = Math.min(100, Math.round((current/target)*100));
  const btnLabel = claimed ? t('mission_claimed') : (done ? t('mission_claim') : t('mission_locked'));
  return `<div class="mission-item">
    <div class="mission-item-top">
      <div class="mission-item-title">${title}</div>
      <div class="mission-item-reward">${t('mission_reward', coin)}</div>
    </div>
    <div class="mission-progress-bar"><div class="mission-progress-fill" style="width:${pct}%"></div></div>
    <div class="mission-item-bottom">
      <div class="mission-item-count">${Math.min(current,target)} / ${target}</div>
      <button type="button" class="mission-claim-btn" data-kind="${kind}" ${(!done||claimed)?'disabled':''}>${btnLabel}</button>
    </div>
  </div>`;
}
function claimableMissionCount(){
  return (missionState.loginDone && !missionState.claimedLogin ? 1:0) +
    (missionState.stageCount>=DAILY_STAGE_TARGET && !missionState.claimedStage ? 1:0) +
    (missionState.hintUsed && !missionState.claimedHint ? 1:0) +
    (missionState.loginDays.length>=WEEKLY_LOGIN_TARGET && !missionState.claimedWeekLogin ? 1:0) +
    (missionState.normalCleared>=WEEKLY_NORMAL_TARGET && !missionState.claimedWeekNormal ? 1:0) +
    (missionState.hardCleared>=WEEKLY_HARD_TARGET && !missionState.claimedWeekHard ? 1:0);
}
function renderMissionCard(){
  const label = document.getElementById('mission-ready-label');
  const check = document.getElementById('mission-ready-check');
  if(!label || !check) return;
  const n = claimableMissionCount();
  label.textContent = n>0 ? t('mission_claimable', n) : t('mission_button');
  check.style.display = n>0 ? 'flex' : 'none';
}
function nextSundayMidnight(){
  const d = new Date();
  let daysUntil = (7 - d.getDay()) % 7;
  if(daysUntil === 0) daysUntil = 7;   // today's own reset already happened; count to next week's
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate() + daysUntil, 0, 0, 0, 0);
  return target;
}
let missionCountdownHandle = null;
function tickMissionCountdown(){
  const el = document.getElementById('mission-reset-timer');
  if(!el) return;
  let diff = Math.max(0, nextSundayMidnight() - new Date());
  const days = Math.floor(diff/86400000); diff -= days*86400000;
  const hours = Math.floor(diff/3600000); diff -= hours*3600000;
  const mins = Math.floor(diff/60000); diff -= mins*60000;
  const secs = Math.floor(diff/1000);
  const hh = String(hours).padStart(2,'0'), mm = String(mins).padStart(2,'0'), ss = String(secs).padStart(2,'0');
  el.textContent = days>0 ? `${days}${lang==='ja'?'日':'d'} ${hh}:${mm}:${ss}` : `${hh}:${mm}:${ss}`;
}
function startMissionCountdown(){
  stopMissionCountdown();
  tickMissionCountdown();
  missionCountdownHandle = setInterval(tickMissionCountdown, 1000);
}
function stopMissionCountdown(){
  if(missionCountdownHandle){ clearInterval(missionCountdownHandle); missionCountdownHandle = null; }
}
function renderMissions(){
  rollMissionState();
  renderMissionCard();
  const coinEl = document.getElementById('mission-coin-balance');
  if(coinEl) coinEl.textContent = progress.coins;
  const dailyEl = document.getElementById('mission-list-daily');
  const weeklyEl = document.getElementById('mission-list-weekly');
  if(!dailyEl || !weeklyEl) return;
  dailyEl.innerHTML =
    missionRow({title:t('mission_login'), current:missionState.loginDone?1:0, target:1, claimed:missionState.claimedLogin, kind:'login', coin:DAILY_MISSION_COIN}) +
    missionRow({title:t('mission_daily_stage'), current:missionState.stageCount, target:DAILY_STAGE_TARGET, claimed:missionState.claimedStage, kind:'stage', coin:DAILY_MISSION_COIN}) +
    missionRow({title:t('mission_daily_hint'), current:missionState.hintUsed?1:0, target:1, claimed:missionState.claimedHint, kind:'hint', coin:DAILY_MISSION_COIN});
  weeklyEl.innerHTML =
    missionRow({title:t('mission_weekly_login'), current:missionState.loginDays.length, target:WEEKLY_LOGIN_TARGET, claimed:missionState.claimedWeekLogin, kind:'weekLogin', coin:WEEKLY_MISSION_COIN}) +
    missionRow({title:t('mission_weekly_normal'), current:missionState.normalCleared, target:WEEKLY_NORMAL_TARGET, claimed:missionState.claimedWeekNormal, kind:'weekNormal', coin:WEEKLY_MISSION_COIN}) +
    missionRow({title:t('mission_weekly_hard'), current:missionState.hardCleared, target:WEEKLY_HARD_TARGET, claimed:missionState.claimedWeekHard, kind:'weekHard', coin:WEEKLY_MISSION_COIN});
  [dailyEl, weeklyEl].forEach(list=>{
    list.querySelectorAll('.mission-claim-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>claimMission(btn.dataset.kind));
    });
  });
}
